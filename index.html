<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Word Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:light;
  --bg:#bfe7ff; --ink:#1d2340; --card:#ffffff; --line:#1d2340;
  --green:#3ccf6e; --red:#ff5a5f; --yellow:#ffd23f; --blue:#3d8bff; --purple:#8b5cf6; --orange:#ff8a3d;
  --muted:#6b7394;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Fredoka",system-ui,sans-serif}
body{min-height:100vh;background:
  linear-gradient(180deg,#8fd3ff 0%,#bfe7ff 45%,#9be38f 45.2%,#7fd472 100%) fixed}
.en{font-family:"Fredoka","Jua",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 14px 40px}
button{font-family:inherit;cursor:pointer;border:none;color:var(--ink);-webkit-text-fill-color:currentColor}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:14px 16px;font-size:20px;border:3px solid var(--line);border-radius:14px;box-shadow:0 5px 0 var(--line);background:var(--yellow);color:var(--ink);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.green{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.white{background:#fff}
.btn.small{font-size:16px;padding:10px 12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
h1{font-size:34px;margin:6px 0 2px;text-align:center;text-shadow:0 3px 0 #fff}
.sub{text-align:center;color:var(--muted);margin:0 0 10px;font-size:16px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 10px;font-size:17px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.back{background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 10px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.grow{flex:1}

/* blocky avatar (original) */
.ava{width:64px;height:84px;position:relative;flex:none}
.ava .head{position:absolute;left:14px;top:0;width:36px;height:34px;background:#ffd8a8;border:3px solid var(--line);border-radius:6px}
.ava .head:before,.ava .head:after{content:"";position:absolute;top:11px;width:6px;height:8px;background:var(--line);border-radius:2px}
.ava .head:before{left:8px}.ava .head:after{right:8px}
.ava .body{position:absolute;left:8px;top:36px;width:48px;height:30px;border:3px solid var(--line);border-radius:6px}
.ava .legs{position:absolute;left:14px;top:66px;width:36px;height:18px;background:#3b4a7a;border:3px solid var(--line);border-radius:4px}
.ava.big{transform:scale(1.4);margin:14px 20px}

.prof{display:flex;align-items:center;gap:14px;text-align:left;font-size:22px}
.prof small{display:block;color:var(--muted);font-size:15px}

.bar{height:16px;background:#e7ebf7;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;text-align:left;box-shadow:0 4px 0 var(--line);font-size:17px}
.stage.on{background:#fff6cc;outline:4px solid var(--orange)}
.stage small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.stage.big{font-size:19px}.stage .gicon{font-size:22px}.stage small.now{color:var(--orange);font-weight:700;margin-top:4px}

.island{position:relative;min-height:150px;background:radial-gradient(ellipse at 50% 80%,#ffe6a3 0 55%,#7fd472 56%);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);overflow:visible;padding:16px 8px 26px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pet{font-size:38px;background:none;animation:bob 2.4s ease-in-out infinite;position:relative;padding:2px}
.pet:nth-child(2n){animation-delay:.6s}.pet:nth-child(3n){animation-delay:1.1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bubble{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--line);border-radius:12px;padding:6px 10px;font-size:15px;white-space:nowrap;z-index:5;animation:none}
.empty{color:#4c6b3c;font-size:16px;align-self:center;text-align:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.word{font-size:46px;text-align:center;margin:8px 0 2px;font-weight:700;letter-spacing:.5px}
.pos{text-align:center;color:var(--muted);font-size:16px}
.ko{text-align:center;font-size:28px;margin:10px 0}
.def{text-align:center;color:var(--muted);font-size:17px}
.ex{font-size:20px;line-height:1.45;background:#f3f6ff;border:2px dashed #9aa6d6;border-radius:12px;padding:12px;margin-top:12px}
.hl{background:var(--yellow);padding:0 4px;border-radius:5px}
.blank{display:inline-block;min-width:80px;border-bottom:4px solid var(--line);text-align:center;color:var(--blue)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:13px;font-size:21px;box-shadow:0 4px 0 var(--line);text-align:center}
.opt .mk{display:block;font-size:14px;opacity:.7;margin-top:3px;font-family:"Jua",sans-serif}
.letters{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.lb{width:24px;height:30px;border-bottom:3px solid var(--line);text-align:center;font-size:22px;font-weight:700;color:var(--blue)}
.clue{text-decoration:underline 3px var(--purple);text-underline-offset:3px;background:#efe7ff}
.why{margin-top:10px;background:#f6f2ff;border:2px solid var(--purple);border-radius:12px;padding:10px;font-size:16px;line-height:1.45}
.sat{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;margin-right:6px}
.mean-en{text-align:center;font-family:"Fredoka",sans-serif;font-size:24px;margin:10px 0 2px}
.mean-ko{text-align:center;color:var(--muted);font-size:16px}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--red);color:#fff}
.say{background:var(--blue);color:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 10px;font-size:18px;box-shadow:0 3px 0 var(--line);margin-left:6px;vertical-align:middle}
.tag{display:inline-block;font-size:14px;padding:2px 8px;border-radius:999px;border:2px solid var(--line);background:#fff}
.tag.boss{background:var(--purple);color:#fff}
.tag.new{background:var(--yellow)}
.fb{border-radius:14px;padding:12px;margin-top:12px;font-size:19px;border:3px solid var(--line)}
.fb.ok{background:#d8f8e2}.fb.no{background:#ffe0e1}
input[type=text],textarea{width:100%;font-family:"Fredoka",sans-serif;font-size:22px;padding:12px;border:3px solid var(--line);border-radius:12px;margin-top:12px}
textarea{min-height:90px;font-size:19px}
.combo{white-space:nowrap;position:fixed;top:20%;left:50%;transform:translateX(-50%);font-size:36px;color:#fff;text-shadow:0 3px 0 var(--line),0 0 8px var(--line);pointer-events:none;animation:pop 1s forwards;z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.stamp{text-align:center;font-size:24px;background:var(--yellow);border:3px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 0 var(--line);transform:rotate(-2deg)}
.big{font-size:56px;text-align:center}
.list .it{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:2px dashed #d6dbef;font-size:18px}
.list .it:last-child{border:none}
.list .it b{font-family:"Fredoka";min-width:120px}
.list .it span{flex:1;color:var(--muted);font-size:16px}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:30px;text-align:center}
.note{font-size:15px;color:var(--muted);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:440px;width:100%}
label{display:block;margin-top:10px;font-size:16px}
.colors{display:flex;gap:8px;margin-top:6px}
.colors button{width:36px;height:36px;border-radius:10px;border:3px solid var(--line)}
.colors button.on{outline:4px solid var(--orange)}
.fam{margin-top:12px;background:#fff8e6;border:2px dashed #f0c060;border-radius:14px;padding:8px 12px;text-align:left}
.fam summary{cursor:pointer;font-weight:700}
.frow{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid #f3e2b8}
.frow .fl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.frow .fpos{color:#8b5cf6;font-size:13px}.frow .fin{margin-left:auto}
.frow{display:block}.frel{font-size:12px;color:#8a7a50}.fnote{font-size:13px;color:#7a5b00;background:#fff1c2;border-radius:8px;padding:3px 6px;margin-top:3px}.fex{font-size:13px;color:#555;margin-top:2px}.fadv{opacity:.85}.fme{background:#fff1c2;border-radius:8px;padding-left:4px}.fmore{margin-top:6px}.fmore summary{cursor:pointer;color:#8a7a50;font-size:14px}
.flag{background:none;border:none;color:#999;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:8px;width:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== WORD DATA =====================
   word | part of speech | 한국어 뜻 | English meaning | example (*marked* form)  */
const STAGES = [
 {id:"e", name:"Elementary", sub:"Grade 4–6 review", icon:"🌱", data:[
"ignore|v.|무시하다|to pay no attention to|If you *ignore* a small leak in the roof, it can turn into a much bigger problem.||repair,report,measure|It's hard to *ignore* the noise from the construction site.",
"brief|adj.|짧은, 잠깐의|lasting a short time|After a *brief* pause to catch his breath, the runner sprinted toward the finish line.||permanent,annual,ancient|The principal gave a *brief* speech before the assembly began.",
"recognize|v.|알아보다|to know from before|Even after ten years apart, the two friends *recognized* each other immediately.||forgot,ignored,avoided|I didn't *recognize* my teacher without her glasses.",
"locate|v.|위치를 찾아내다|to find where something is|Bats *locate* insects in the dark by sending out sounds and listening for the echoes.||produce,release,decorate|I could not *locate* my keys anywhere in the house.",
"major|adj.|주요한, 큰|important or big|Pollution is a *major* problem in many large cities, especially on hot days.||minor,tiny,fake|The new highway was a *major* improvement for the town.",
"energy|n.|에너지|the power that makes things move, work, or change|Plants get the *energy* they need to grow from sunlight.||water,shadow,soil|Running a race uses a lot of *energy*, so athletes eat a big meal the night before.",
"solution|n.|해결책|an answer to a problem|The engineers found a clever *solution* to the traffic problem by changing the timing of the lights.||cause,obstacle,excuse|We need to find a *solution* to the parking problem.",
"sincere|adj.|진심 어린|honest and real|His apology seemed *sincere*, so she agreed to forgive him.||fake,rude,careless|Please accept my *sincere* thanks for your help.",
"drowsy|adj.|졸린|sleepy|This medicine may make you *drowsy*, so you should not ride a bike after taking it.||alert,strong,cheerful|The long car ride made everyone *drowsy*.",
"concern|n.|걱정, 관심사|a worry|The doctor's main *concern* was that the infection might spread if it was not treated quickly.||reward,talent,hobby|The rising price of food is a *concern* for many families.",
"complain|v.|불평하다|to say you are unhappy about something|Instead of *complaining* about the rules, the students wrote a letter suggesting how to improve them.||celebrating,decorating,imitating|My little brother always *complains* when it is time to take a bath.",
"adjust|v.|조정하다|to change slightly to fit|Our eyes need a few minutes to *adjust* when we walk from a bright hallway into a dark theater.||close,water,freeze|If the chair is too low, you can *adjust* the height with this lever.",
"prefer|v.|선호하다|to like better|Cats usually *prefer* warm, quiet places where they can nap without being disturbed.||avoid,fear,hate|I *prefer* reading books to watching TV.",
"rely|v.|의지하다|to depend on|Many farmers *rely* on rain because they cannot afford expensive watering systems.||insist,frown,comment|You can always *rely* on me to help you.",
"defeat|v.|물리치다, 이기다|to beat in a fight or game|The underdog team *defeated* the champions by using a strategy no one expected.||admired,joined,congratulated|Our soccer team *defeated* the champions three to one.",
"atom|n.|원자|the smallest part of a chemical element|Everything around you, from your desk to the air, is made of tiny *atoms* too small to see.||planets,cells,crystals|A single drop of water contains billions of *atoms*.",
"reluctant|adj.|꺼리는, 마지못한|not wanting to do something|He was *reluctant* to try sushi at first, but it quickly became his favorite food.||eager,excited,delighted|The shy boy was *reluctant* to sing in front of the class.",
"convince|v.|확신시키다, 설득하다|to make someone believe something|It took several experiments to *convince* the class that heavy and light objects fall at the same speed.||distract,frighten,interrupt|I finally *convinced* my sister to watch the scary movie with me.",
"select|v.|선택하다|to choose|The teacher *selected* three students to represent the class at the science competition.||punished,ignored,rejected|*Select* the correct answer from the list below.",
"steady|adj.|꾸준한, 흔들림 없는|firm; not changing|The economy showed *steady* growth over the past five years.||sudden,zero,careless|Hold the camera *steady* so the photo isn't blurry.",
"occur|v.|일어나다, 발생하다|to happen|Earthquakes *occur* most often along the edges of the plates that make up Earth's surface.||vanish,migrate,freeze|When did the accident *occur*?",
"mysterious|adj.|신비한, 이상한|strange and hard to explain|A *mysterious* light appeared in the sky, and no one could explain where it came from.||familiar,ordinary,expected|The *mysterious* box had no name or address on it.",
"tradition|n.|전통|a custom passed down|Lighting lanterns during the festival is a *tradition* that goes back hundreds of years.||mistake,accident,rumor|Eating turkey on Thanksgiving is an American *tradition*.",
"damage|n.|피해, 손상|harm done to something|The hurricane caused so much *damage* that some families could not return home for months.||harvest,wisdom,laughter|The flood caused serious *damage* to the school's first floor.",
"data|n.|자료, 데이터|facts and numbers collected to study something|The class collected *data* on how many birds visited the feeder each day.||opinions,stories,rumors|Scientists study weather *data* to predict storms.",
"typical|adj.|전형적인, 보통의|normal; usual|On a *typical* school day, students spend about six hours in class.||rare,strange,imaginary|A *typical* lunch at my school includes pizza or tacos.",
"challenge|n.|도전, 어려운 일|something hard that tests you|Climbing the mountain in winter was a *challenge* that only the most experienced hikers attempted.||reward,symbol,summary|The math puzzle was a real *challenge*, but I finally solved it.",
"glance|v.|흘끗 보다|to look quickly|She *glanced* at her watch and realized she had only five minutes to catch the bus.||threw,polished,repaired|He *glanced* at the clock and realized he was late.",
"imitate|v.|흉내 내다, 모방하다|to copy|Mockingbirds can *imitate* the songs of dozens of other birds and even car alarms.||silence,forget,ignore|Little kids often *imitate* their older brothers and sisters.",
"transport|v.|수송하다|to carry from place to place|Pipelines *transport* oil across hundreds of miles of land.||spill,waste,burn|Trucks *transport* fresh vegetables to grocery stores.",
"capable|adj.|할 수 있는, 유능한|able to do something well|Crows are *capable* of solving puzzles that challenge even some young children.||tired,jealous,ashamed|Even young children are *capable* of helping with simple chores.",
"contain|v.|포함하다, 담고 있다|to have inside|Spinach *contains* iron, a mineral that helps carry oxygen through the body.||lacks,destroys,resembles|This box *contains* old family photos from the 1980s.",
"recent|adj.|최근의|happening not long ago|*Recent* research suggests that some dinosaurs may have had feathers.||ancient,future,missing|In *recent* years, more people have started riding electric scooters.",
"represent|v.|대표하다, 나타내다|to stand for|On the map, the blue lines *represent* rivers, and the green areas show forests.||prevent,ignore,pollute|The stars on the flag *represent* the fifty states.",
"experiment|n.|실험|a test done to find out or prove something|In our *experiment*, we tested which paper towel could hold the most water.||vacation,argument,ceremony|The students did an *experiment* to see if plants grow faster with music.",
"organize|v.|정리하다, 조직하다|to arrange in order|The students *organized* a fundraiser to buy new books for the school library.||canceled,ignored,forgot|Let's *organize* our toys into boxes.",
"restore|v.|복구하다|to bring back to how it was|Workers spent years carefully *restoring* the old theater to its original beauty.||destroying,abandoning,selling|The power was *restored* after three hours.",
"character|n.|등장인물, 성격|a person in a story; who someone is|The main *character* in the novel grows braver with each obstacle she faces.||setting,chapter,title|My favorite *character* in the movie is the clumsy robot.",
"indicate|v.|나타내다, 가리키다|to show or point out|Dark clouds and a sudden drop in temperature often *indicate* that a storm is coming.||prevent,hide,cancel|The red light *indicates* that the oven is still hot.",
"method|n.|방법|a way of doing something|Each scientist used a different *method*, but they all reached the same conclusion.||emotion,hobby,nickname|My favorite *method* for memorizing words is using flash cards.",
"absorb|v.|흡수하다|to soak up|Dark clothing tends to *absorb* more sunlight, which is why black shirts feel hotter on summer afternoons.||reflect,release,scatter|Paper towels *absorb* spills much faster than cloth napkins.",
"defend|v.|방어하다|to protect from attack|Porcupines *defend* themselves with sharp quills that stick to anything that touches them.||feed,warm,clean|The knight swore to *defend* the castle against any attack.",
"instinct|n.|본능|a natural feeling or behavior|Sea turtles find their way to the ocean by *instinct* as soon as they hatch.||accident,permission,invitation|Ducklings follow their mother by *instinct*.",
"cooperate|v.|협력하다|to work together|Ants *cooperate* so well that a colony can move food many times heavier than any single ant.||compete,argue,hibernate|If we *cooperate*, we can clean the whole house in an hour.",
"observation|n.|관찰|the act of watching something carefully to learn about it|After a week of careful *observation*, Leo noticed that the caterpillar had built a cocoon.||imagination,decoration,celebration|Write down every *observation* you make about the moon this month.",
"isolate|v.|고립시키다|to separate from others|Doctors *isolated* the patient so the disease would not spread to others in the hospital.||visited,hugged,released|The island is *isolated* from the mainland during winter storms.",
"estimate|v.|어림잡다|to make a careful guess about a number|Experts *estimate* that there are more than eight million species of plants and animals on Earth.||forget,deny,ignore|Can you *estimate* how many jelly beans are in the jar?",
"doubt|v.|의심하다|to feel unsure|Some scientists *doubted* the new theory until other researchers repeated the experiment.||proved,celebrated,invented|I *doubt* that it will snow in Los Angeles this winter.",
"detail|n.|세부 사항|a small part or fact|A good detective notices every *detail*, even a single footprint or a misplaced book.||reward,holiday,opinion|The painting is so realistic that you can see every *detail* of the flowers.",
"demand|v.|요구하다|to ask for strongly|As the weather grew colder, customers *demanded* warmer jackets, and the store quickly ran out.||refused,donated,ignored|The workers *demanded* better pay and safer working conditions.",
"attitude|n.|태도|the way you think or feel about something|A positive *attitude* will not solve every problem, but it makes hard work feel much more manageable.||amount,injury,odor|The coach praised her great *attitude*, even after the team lost.",
"effect|n.|효과, 영향|a result|Scientists are still studying the long-term *effect* of screen time on children's sleep.||affect,effort,recipe|The new medicine had a calming *effect* on the patient.",
"splendid|adj.|훌륭한, 화려한|very good; beautiful|The palace gardens were *splendid*, filled with fountains, statues, and rare flowers.||shabby,empty,ordinary|We had a *splendid* time at the amusement park.",
"admire|v.|존경하다, 감탄하다|to respect or look at with pleasure|Many people *admire* explorers who risked their lives to map places no one had ever seen.||ignore,blame,doubt|I *admire* my grandfather for learning to swim at the age of seventy.",
"pattern|n.|패턴, 규칙성|something that repeats in a regular way|The numbers 2, 4, 6, 8 follow a simple *pattern*: each one is two more than the last.||mistake,surprise,secret|The quilt had a *pattern* of red and white squares.",
"observe|v.|관찰하다|to watch carefully|Astronomers *observe* distant stars to learn how the universe has changed over time.||visit,build,ignore|We *observed* the moon through a telescope.",
"identify|v.|알아보다, 확인하다|to recognize who or what something is|Birdwatchers can *identify* many species just by listening to their songs.||feed,capture,frighten|Can you *identify* the bird that is singing outside?",
"familiar|adj.|익숙한|well known|The song sounded *familiar*, but I could not remember where I had heard it before.||strange,delicious,invisible|Her face looked *familiar*, but I couldn't remember her name.",
"react|v.|반응하다|to respond|How a person *reacts* to stress can affect both their health and their relationships.||invites,applauds,delivers|How did your mom *react* when you told her the news?",
"describe|v.|묘사하다|to tell what something is like|In your essay, *describe* a place that is important to you and explain why it matters.||forget,hide,avoid|Can you *describe* the man who took your bike?",

"biodiversity|n.|생물 다양성|the variety of plants and animals in an area|Rainforests have great *biodiversity*.|A single acre of the Amazon rainforest can contain hundreds of kinds of trees and thousands of kinds of insects, making it one of the places with the greatest *biodiversity* on Earth.|pollution,temperature,population|Cutting down forests reduces *biodiversity*.|||R|hundreds of kinds of trees and thousands of kinds of insects|Many different kinds of living things → biodiversity.",
"genetics|n.|유전학|the science of how traits are passed from parents to offspring|Gregor Mendel is called the father of *genetics* because of his experiments with pea plants.|Advances in *genetics* now allow doctors to test a baby's DNA and find out whether it has inherited certain diseases from its parents.|geography,astronomy,geology|She wants to study *genetics* in college.|||R|test a baby's DNA and find out whether it has inherited|The science of DNA and inherited traits → genetics.",
"republic|n.|공화국|a country where people elect representatives to govern|The United States is a *republic*.|After the king was overthrown in 1792, France became a *republic*, with leaders chosen by the people instead of born into power.|monarchy,empire,kingdom|In a *republic*, citizens vote for representatives who make laws.|||C|leaders chosen by the people instead of born into power|Elected leaders rather than a king → republic.",
"amendment|n.|(헌법) 수정 조항, 개정|a change or addition to a law or document|The First *Amendment* protects freedom of speech.|The Constitution can be changed, but it is difficult: an *amendment* must be approved by two-thirds of Congress and three-fourths of the states.|election,signature,holiday|The Nineteenth *Amendment* gave women the right to vote.|||R|The Constitution can be changed|A change to the Constitution → amendment.",
"legislation|n.|법률, 입법|laws, or the process of making laws|Congress passed new *legislation* to protect endangered animals.|After several serious accidents, lawmakers introduced *legislation* that would make wearing a helmet required for anyone riding a motorcycle.|weather,celebrations,advertisements|The governor signed the *legislation* into law.|||R|that would make wearing a helmet required|A proposed law → legislation.",
"executive|adj.|행정의, 집행의|relating to the part of government that carries out laws|The president leads the *executive* branch of government.|The U.S. government has three branches: the legislative branch makes the laws, the judicial branch interprets them, and the *executive* branch, led by the president, carries them out.|musical,athletic,artistic|The governor is the head of the state's *executive* branch.|||R|led by the president, carries them out|The branch that carries out laws → executive.",
"judicial|adj.|사법의|relating to courts and judges|The Supreme Court is the highest part of the *judicial* branch.|When two states argued over who owned an island in the river, they took the case to the *judicial* branch, where judges decided which state's claim followed the law.|athletic,musical,medical|The *judicial* system is supposed to treat everyone equally.|||R|where judges decided|Relating to courts and judges → judicial.",
"federal|adj.|연방의|relating to the national government of a country made of states|The *federal* government prints money for the whole country.|States make their own rules about driving ages, but the *federal* government, located in Washington, D.C., controls things that affect the whole nation, such as the military and the mail.|local,private,foreign|Taxes paid to the *federal* government help fund national parks.|||C|States make their own rules about driving ages, but|National, not state, government → federal.",
"taxation|n.|과세, 조세|the system of collecting money from people to pay for government|The colonists protested *taxation* without representation.|Public schools, roads, and fire departments are paid for through *taxation*, the money that citizens and businesses give to the government each year.|donations,celebration,decoration|Some people believe *taxation* on sugary drinks will improve public health.|||R|the money that citizens and businesses give to the government each year|Money collected by the government → taxation.",
"diplomacy|n.|외교|the work of managing relationships between countries|The two nations ended their dispute through *diplomacy* instead of war.|Instead of sending soldiers, the president chose *diplomacy*, sending ambassadors to meet with the other country's leaders and work out a peaceful agreement.|warfare,invasion,punishment|Benjamin Franklin used his skill in *diplomacy* to win French support for the American Revolution.|||C|Instead of sending soldiers|Peaceful talks rather than force → diplomacy.",
"coefficient|n.|계수|the number multiplied by a variable in math|In 7x, the *coefficient* is 7.|In the expression 5y + 3, the number 3 stands alone, but the number 5 is the *coefficient*, because it is multiplied by the variable y.|exponent,remainder,denominator|What is the *coefficient* of x in the expression 9x − 4?|||R|because it is multiplied by the variable y|The number multiplied by a variable → coefficient.",
"exponent|n.|지수|a small number showing how many times to multiply a number by itself|In 2³, the *exponent* is 3, so you multiply 2 × 2 × 2.|The number 10⁶ means 1,000,000; the *exponent*, 6, tells you how many times to multiply 10 by itself.|coefficient,denominator,remainder|When you square a number, the *exponent* is 2.|||R|tells you how many times to multiply 10 by itself|The small raised number that tells how many times → exponent.",
"inequality|n.|불평등; 부등식|unfairness between groups; a math statement using < or >|There is great *inequality* between rich and poor in many countries.|The math statement x > 5 is an *inequality*, not an equation, because it shows that x is greater than 5 rather than equal to it.|equation,fraction,variable|Some workers protested the *inequality* in pay between men and women.|||C|not an equation, because it shows that x is greater than 5 rather than equal|Uses > instead of = → inequality.",
"statistics|n.|통계, 통계학|numbers collected to show facts; the study of such numbers|*Statistics* show that wearing seat belts saves thousands of lives each year.|The coach keeps detailed *statistics* on every player, such as how many shots each one takes and what percentage of them go in.|rumors,stories,uniforms|She took a class in *statistics* to learn how to analyze data.|||X|such as how many shots each one takes and what percentage|Collected numbers about players → statistics.",
"signify|v.|의미하다, 나타내다|to be a sign of; to mean|A red light *signifies* that drivers must stop.|In many cultures, a white dove *signifies* peace, which is why doves are often released at ceremonies marking the end of a war.|causes,ignores,prevents|What does the green check mark *signify*?|||E|which is why doves are often released at ceremonies marking the end of a war|Stands for peace → signifies.",
"correlate|v.|상관관계가 있다, 연관되다|to have a connection in which one thing changes along with another|Higher temperatures *correlate* with more ice cream sales.|The researchers found that students' reading scores *correlated* with the number of books in their homes: the more books a family owned, the higher the scores tended to be.|competed,argued,collided|Scientists want to know whether screen time *correlates* with poor sleep.|||R|the more books a family owned, the higher the scores tended to be|Two things rising together → correlated."
]},
 {id:"l", name:"Linking Words", sub:"however · therefore · although", icon:"🔗", data:[
"however|transition|그러나|but; shows that the next idea is different or surprising|I wanted to go swimming. *However*, the pool was closed for repairs.|The movie got great reviews. *However*, my brother thought it was boring.|Therefore,For example,Similarly|Lily practiced every day; *however*, she still felt nervous before the recital.|||ct|my brother thought it was boring|Great reviews vs. he thought it was boring → opposite ideas → However.",
"nevertheless|transition|그럼에도 불구하고|even so; something happens even though there is a reason it might not|The hike was long and steep. *Nevertheless*, the whole class reached the top.|Max had a bad cold on the day of the race. *Nevertheless*, he finished in second place.|As a result,For example,Likewise|The tickets were expensive; *nevertheless*, the concert sold out in an hour.|||cs|he finished in second place|Bad cold, but he still did well → even so → Nevertheless.",
"nonetheless|transition|그렇기는 하지만, 그래도|even so; in spite of what was just said|The test was very hard. *Nonetheless*, most students passed.|The puppy chewed up Mom's favorite shoes. *Nonetheless*, she couldn't stay angry at him for long.|Therefore,Specifically,Similarly|The weather was freezing; *nonetheless*, hundreds of people came to the parade.|||cs|she couldn't stay angry at him for long|He did something bad, but she still wasn't angry → even so → Nonetheless.",
"whereas|conj.|반면에|while on the other hand; compares two different things|Cats like to sleep most of the day, *whereas* puppies want to play all the time.|My sister loves spicy food, *whereas* I can't eat anything hotter than ketchup.|because,so that,since|Summer days are long, *whereas* winter days are short.|||ct|I can't eat anything hotter than ketchup|Loves spicy food vs. can't eat spicy food → two opposite facts → whereas.",
"although|conj.|비록 ~이지만|even though|*Although* it was raining, we still played soccer.|*Although* the box was small, it was surprisingly heavy.|Because,Since,Once|*Although* he is only eight, he can already play the piano well.|||cs|it was surprisingly heavy|Small but heavy → surprising contrast inside one sentence → Although.",
"despite|prep.|~에도 불구하고|without being stopped by something|*Despite* the cold weather, the children played outside all afternoon.|*Despite* her broken arm, Mia still came to watch every one of her team's games.|Because of,Due to,Thanks to|*Despite* the noise, the baby slept peacefully.|||cs|still came to watch every one of her team's games|A broken arm did not stop her → Despite.",
"instead|transition|대신에|in place of something else|We didn't go to the beach. *Instead*, we went to the movies.|Sara did not take the bus to school this morning. *Instead*, she rode her bike.|Similarly,For example,Moreover|Dad forgot to buy rice, so we had noodles *instead*.|||al|she rode her bike|Bike replaces the bus → Instead.",
"alternatively|transition|그 대신, 또 다른 방법으로|as another choice|You can walk to the museum. *Alternatively*, you can take the number 5 bus.|To get to the library, you can take the stairs. *Alternatively*, you can use the elevator by the front door.|Therefore,However,In contrast|We could have pizza for dinner, or *alternatively*, we could make tacos.|||al|you can use the elevator by the front door|A second choice for the same goal → Alternatively.",
"in contrast|transition|대조적으로|showing how two things are very different|The desert is hot and dry. *In contrast*, the rainforest is wet and full of plants.|My old phone was slow and heavy. *In contrast*, my new phone is fast and light.|Similarly,For example,As a result|Ants work in large groups. *In contrast*, many spiders live alone.|||ct|my new phone is fast and light|Slow and heavy vs. fast and light → In contrast.",
"on the contrary|transition|오히려, 그와는 반대로|the opposite is true|The test wasn't hard. *On the contrary*, it was the easiest test of the year.|Some people think sharks are always dangerous. *On the contrary*, most sharks rarely bother humans.|As a result,In addition,Similarly|Leo isn't shy at all. *On the contrary*, he talks to everyone.|||ct|most sharks rarely bother humans|Rejects the first idea and says the opposite is true → On the contrary.",
"therefore|transition|그러므로|for that reason|It started to snow heavily. *Therefore*, school was canceled.|The baseball game was tied after nine innings. *Therefore*, the teams played an extra inning.|However,For example,Instead|Sam studied hard; *therefore*, he did well on the test.|||rs|the teams played an extra inning|The tie is the reason for the extra inning → result → Therefore.",
"thus|transition|따라서|so; as a result|The bridge was damaged by the flood. *Thus*, drivers had to take a longer road.|Plants need sunlight to make food. *Thus*, a plant kept in a dark closet will slowly die.|However,Similarly,Meanwhile|The store ran out of milk; *thus*, we bought juice.|||rs|a plant kept in a dark closet will slowly die|No sunlight → no food → the plant dies → result → Thus.",
"hence|transition|그러므로, 이런 이유로|for this reason|The road was icy; *hence*, the bus moved very slowly.|Our team had the best record this season. *Hence*, we got to host the final game at our school.|However,Nevertheless,For example|It was her birthday; *hence*, the balloons and the cake.|||rs|we got to host the final game at our school|Best record is the reason → result → Hence.",
"consequently|transition|결과적으로|as a result|Tom forgot to set his alarm. *Consequently*, he was late for school.|The farmer's field got no rain all summer. *Consequently*, his corn plants were small and dry.|However,Similarly,Instead|Jen didn't water her plants; *consequently*, they wilted.|||rs|his corn plants were small and dry|No rain caused small, dry plants → Consequently.",
"accordingly|transition|그에 맞춰, 따라서|in a way that fits what was just said|The forecast called for heavy rain. *Accordingly*, we brought umbrellas.|The teacher said the field trip would involve a lot of walking. *Accordingly*, the students wore comfortable shoes.|However,In contrast,Previously|The coach explained the new rules, and the players changed their plans *accordingly*.|||rs|the students wore comfortable shoes|They acted in a way that fit the information → Accordingly.",
"as a result|transition|그 결과|because of this|Ben practiced the guitar every day. *As a result*, he got much better.|The town built a new bike path along the river. *As a result*, many more people began riding bikes to work.|However,For example,On the contrary|It rained all week. *As a result*, the field was too muddy to play on.|||rs|many more people began riding bikes to work|The new path caused more riders → As a result.",
"moreover|transition|더욱이|also, and even more importantly|The new park is beautiful. *Moreover*, it is free for everyone.|Riding a bike to school is good exercise. *Moreover*, it doesn't pollute the air.|However,Instead,Otherwise|The hotel was clean; *moreover*, the staff were very friendly.|||ad|it doesn't pollute the air|A second good point about riding a bike → adds → Moreover.",
"furthermore|transition|게다가|in addition; adds another point|Dogs are loyal pets. *Furthermore*, they can be trained to help people.|Eating breakfast gives you energy for the morning. *Furthermore*, it can help you focus in class.|However,Instead,Nevertheless|The book was exciting; *furthermore*, it taught me about history.|||ad|it can help you focus in class|Another benefit of breakfast → adds → Furthermore.",
"additionally|transition|추가로|also; as an extra point|You need a pencil for the test. *Additionally*, bring a calculator.|The library lends books to students. *Additionally*, it offers free tutoring after school.|However,Therefore,In contrast|The camp has a pool; *additionally*, it has a climbing wall.|||ad|it offers free tutoring after school|Another service the library offers → Additionally.",
"in addition|transition|그뿐만 아니라|also; adding more information|We will visit the zoo. *In addition*, we will see the aquarium.|Our school collects cans for recycling. *In addition*, students plant trees every spring.|However,Instead,As a result|The store sells toys. *In addition*, it has a small café.|||ad|students plant trees every spring|Another thing the school does for the earth → In addition.",
"likewise|transition|마찬가지로|in the same way|My mom loves gardening. *Likewise*, my grandma spends hours with her flowers.|Bees help flowers by carrying pollen. *Likewise*, some birds and bats carry pollen from plant to plant.|However,Instead,Therefore|Jake was polite to his teacher, and his classmates did *likewise*.|||sm|some birds and bats carry pollen|Birds and bats do the same thing as bees → Likewise.",
"similarly|transition|유사하게, 비슷하게|in a similar way|Fish use fins to swim. *Similarly*, ducks use their webbed feet to move through water.|Kangaroos carry their babies in a pouch. *Similarly*, koalas keep their young in a pouch.|However,Therefore,Instead|Running is good for your heart; swimming is *similarly* healthy.|||sm|koalas keep their young in a pouch|Koalas do the same as kangaroos → Similarly.",
"meanwhile|transition|한편, 그동안에|at the same time, while something else happens|Dad cooked dinner. *Meanwhile*, I set the table.|The players warmed up on the field. *Meanwhile*, the fans found their seats in the stands.|Therefore,For example,Similarly|I'll wash the dishes; *meanwhile*, you can dry them.|||sq|the fans found their seats|Two things happening at the same time → Meanwhile.",
"subsequently|transition|그 후에|later; after that|The team lost the first game. They *subsequently* won the next five games.|The old factory closed in 2010. The building was *subsequently* turned into apartments.|previously,initially,similarly|She broke her leg and *subsequently* missed the rest of the season.|||sq|turned into apartments|First it closed, later it became apartments → after that → subsequently.",
"previously|transition|이전에|before now; earlier|The park is now full of trees. *Previously*, it was an empty parking lot.|Ms. Lee teaches math at our school. *Previously*, she worked as an engineer.|Subsequently,Consequently,Similarly|I had *previously* visited Chicago, so I knew where to go.|||sq|she worked as an engineer|Earlier job before teaching → Previously.",
"initially|transition|처음에는|at the beginning|*Initially*, I didn't like broccoli, but now I love it.|*Initially*, the new student was very quiet, but after a few weeks she made many friends.|Finally,Consequently,Moreover|We *initially* planned to drive, but we took the train instead.|||sq|but after a few weeks she made many friends|At first vs. later → Initially.",
"eventually|transition|결국, 마침내|in the end, after a long time|We waited for hours, and *eventually* the bus arrived.|The baby bird kept flapping its wings, and *eventually* it flew away.|previously,initially,similarly|If you keep practicing, you will *eventually* learn to juggle.|||sq|kept flapping its wings|After a long effort, it finally happened → eventually.",
"indeed|transition|실제로, 정말로|in fact; truly (adds strong support)|The puzzle looked hard. It was *indeed* very hard.|Many people said the new roller coaster was scary. It was *indeed* the scariest ride in the park.|however,instead,otherwise|Max said he could run fast, and he was *indeed* the fastest in the class.|||em|the scariest ride in the park|Confirms what people said → in fact → indeed.",
"notably|transition|특히, 눈에 띄게|especially; in a way worth noticing|Many animals live in the forest, *notably* deer and foxes.|Several students won prizes at the science fair, *notably* Ana, who won first place.|however,therefore,instead|The town has many old buildings, *notably* the 200-year-old church.|||em|who won first place|Points out the most important example → notably.",
"granted|transition|물론 ~이긴 하지만|it is true (admitting a point before arguing)|*Granted*, the movie was long, but it was worth watching.|*Granted*, our team made a lot of mistakes, but we still played hard until the end.|Therefore,Similarly,Meanwhile|*Granted*, homework isn't fun, but it helps you learn.|||cs|but we still played hard until the end|Admits a weak point, then argues the other side → Granted.",
"otherwise|transition|그렇지 않으면|if not; or else|Wear your coat. *Otherwise*, you will get cold.|We need to leave now. *Otherwise*, we will miss the start of the movie.|Similarly,Moreover,For example|Finish your homework first; *otherwise*, you can't play video games.|||al|we will miss the start of the movie|If we don't leave → bad result → Otherwise.",
"specifically|transition|구체적으로|exactly; giving a more exact detail|I love fruit, *specifically* mangoes.|Our class is studying animals, *specifically* animals that live in the ocean.|however,therefore,instead|The teacher asked us to bring supplies, *specifically* glue and scissors.|||em|animals that live in the ocean|Narrows \"animals\" to an exact group → specifically.",
"for example|transition|예를 들어|giving an example|Some animals sleep all winter. *For example*, bears hibernate for months.|Many fruits are rich in vitamin C. *For example*, one orange has more than a day's worth.|However,Instead,Otherwise|Some sports use a net; *for example*, tennis and volleyball.|||ex|one orange has more than a day's worth|An orange is one fruit with vitamin C → an example → For example."
]},
 {id:"h", name:"High School", sub:"Grade 9–12", icon:"⚡", data:[
"nostalgia|n.|향수|longing for the past|The film appeals to audiences' *nostalgia* for a simpler time before smartphones and social media.|The museum's exhibit of 1980s toys and video games triggered waves of *nostalgia* among adult visitors, many of whom remembered playing with them as children.|anxiety,confusion,resentment|Looking at old photographs filled her with *nostalgia*.|longing for the past|hope for the future,fear,boredom|R|remembered playing with them as children|Longing for the past → nostalgia.",
"versatile|adj.|다재다능한|able to do many different things|Bamboo is a remarkably *versatile* material, used for everything from construction to clothing.|Bamboo is a remarkably *versatile* material, used to build houses, make furniture, weave baskets, and even produce clothing.|fragile,expensive,rare|A Swiss Army knife is a *versatile* tool.|adaptable|limited,rigid,narrow|X|build houses, make furniture, weave baskets|Many uses → versatile.",
"hinder|v.|방해하다|to make something harder to do|A lack of reliable data has *hindered* efforts to understand the full impact of the disease.|Poor lighting can *hinder* a reader's comprehension, forcing the eyes to work harder and making it difficult to focus on the text.|enhance,measure,explain|A lack of sleep can *hinder* your ability to learn.|obstruct|assist,promote,speed|R|making it difficult to focus|Making something harder → hinder.",
"commodity|n.|상품, 원자재|a product that can be bought and sold|In the eighteenth century, sugar was one of the most valuable *commodities* in international trade.|In the seventeenth century, nutmeg was such a valuable *commodity* that European nations fought wars to control the small islands where it grew.|hobby,symbol,medicine|Gold is a valuable *commodity* traded around the world.|product|service,idea,tax|E|European nations fought wars to control|Something traded for great profit = commodity.",
"expedite|v.|신속히 처리하다|to speed up|The government passed emergency legislation to *expedite* the delivery of aid to areas affected by the earthquake.|To *expedite* the delivery of medical supplies after the earthquake, the government suspended normal customs inspections.|delay,inspect,limit|Paying extra will *expedite* the delivery of your package.|speed up|delay,block,cancel|E|suspended normal customs inspections|Removing steps to speed things up → expedite.",
"tangible|adj.|실체적인, 만질 수 있는|real; able to be touched|The program produced *tangible* benefits, including higher graduation rates and lower unemployment.|After years of planning, residents were relieved to see *tangible* progress: construction crews had finally begun building the new bridge.|abstract,imaginary,theoretical|The program produced *tangible* results within months.|concrete|abstract,imaginary,invisible|R|construction crews had finally begun building|Real, concrete → tangible.",
"insinuate|v.|넌지시 말하다|to hint something unpleasant|The article *insinuated* that the mayor had accepted bribes, though it offered no direct evidence.|The article *insinuated* that the mayor had accepted bribes, though it never stated the accusation directly or offered any evidence.|proved,denied,announced|Are you *insinuating* that I cheated on the test?|imply|declare,deny,shout|C|though it never stated the accusation directly|Hinting rather than stating → insinuated.",
"supersede|v.|대체하다|to replace|The new treaty *supersedes* all previous agreements between the two countries.|The new safety standards will *supersede* the old regulations, which will no longer apply after January.|resemble,support,precede|The new rules *supersede* the old ones.|replace|precede,follow,support|R|which will no longer apply after January|Replacing → supersede.",
"relegate|v.|좌천시키다, 밀어내다|to move to a lower position|Once a dominant power, the nation was *relegated* to a minor role in international affairs.|Once a celebrated star, the actor was *relegated* to minor roles after a series of box-office failures.|promoted,elevated,restored|The old toys were *relegated* to the attic.|demote|promote,elevate,honor|E|after a series of box-office failures|Moved to a lower position → relegated.",
"hamper|v.|방해하다|to slow down or block|Heavy snowfall *hampered* rescue efforts, delaying the arrival of supplies for several days.|Heavy snowfall *hampered* rescue efforts, preventing helicopters from landing near the stranded hikers.|accelerated,funded,organized|The snow *hampered* our drive to the airport.|hinder|help,speed,ease|R|preventing helicopters from landing|Making things harder → hampered.",
"amass|v.|모으다, 축적하다|to collect a large amount|Over several decades, the collector *amassed* thousands of rare manuscripts, which he later donated to the university.|Over four decades, the naturalist *amassed* a collection of more than 30,000 insect specimens, which she eventually donated to the university museum.|discarded,borrowed,damaged|The billionaire *amassed* a huge collection of rare cars.|accumulate|scatter,spend,borrow|X|a collection of more than 30,000 insect specimens|Building up a huge collection over time → amassed.",
"deter|v.|단념시키다, 막다|to discourage from acting|Supporters of the policy argue that harsher penalties will *deter* people from committing similar crimes.|Researchers found that brightly painted stripes on cattle *deter* biting flies, reducing the number of insects that land on the animals by about half.|attract,feed,breed|Bright lights can *deter* burglars from entering a home.|discourage|encourage,invite,reward|E|reducing the number of insects that land on the animals by about half|Fewer flies landing = discourages them → deter.",
"inept|adj.|서투른|clumsy; lacking skill|The *inept* handling of the crisis led to widespread criticism of the agency's leadership.|The general's *inept* planning led to disaster: his troops ran out of food after only three days of the campaign.|brilliant,careful,secret|The *inept* waiter dropped three plates in one night.|incompetent|skilled,capable,expert|E|his troops ran out of food after only three days|Incompetent → inept.",
"dissent|n.|반대 의견|disagreement with official views|In her powerful *dissent*, the justice argued that the majority's decision would undermine fundamental civil rights.|In a powerful *dissent*, Justice Ginsburg argued that the majority's ruling would make it harder for workers to challenge unfair pay.|verdict,endorsement,confession|There was little *dissent* when the class voted for a pizza party.|disagreement|approval,obedience,silence|R|argued that the majority's ruling would|A justice disagreeing with the majority → dissent.",
"inadvertent|adj.|우연의, 의도치 않은|not on purpose|The scientist's *inadvertent* contamination of a sample led to the accidental discovery of a new compound.|The discovery of penicillin was *inadvertent*: Alexander Fleming noticed that mold had accidentally contaminated one of his bacterial cultures.|deliberate,premeditated,expensive|The *inadvertent* mistake cost the team the game.|accidental|deliberate,planned,careful|R|had accidentally contaminated|Accidental → inadvertent.",

 {id:"t", name:"SAT Transitions", sub:"logic between sentences", icon:"🧭", data:[
"however|transition|그러나|but; introduces an idea that contrasts with or limits the one before|Early reviews of the novel were harsh. *However*, it later became one of the best-selling books of the decade.|For decades, scientists assumed that octopuses, as solitary animals, lacked complex social behavior. Recent underwater footage, *however*, shows groups of octopuses sharing dens and even signaling to one another with changes in color.|therefore,for example,similarly|The experiment produced promising results; *however*, the sample size was too small to draw firm conclusions.|||ct|shows groups of octopuses sharing dens and even signaling to one another|\"Lacked social behavior\" vs. footage showing social behavior → contrast → however.",
"nevertheless|transition|그럼에도 불구하고|even so; despite what was just stated|The proposal faced strong opposition from local businesses. *Nevertheless*, the city council approved it by a wide margin.|The archaeologists' funding was cut halfway through the excavation season, forcing them to work with half their usual team. *Nevertheless*, they uncovered more artifacts that summer than in any previous year.|Consequently,For instance,Likewise|The bridge design was criticized as too expensive; *nevertheless*, engineers praised its durability.|||cs|they uncovered more artifacts that summer than in any previous year|A problem (cut funding) that should have hurt them, yet a great result → concession → Nevertheless.",
"nonetheless|transition|그렇기는 하지만, 그래도|even so; in spite of the previous point|The study had several limitations. *Nonetheless*, its findings influenced public health policy for years.|Marie Curie's early experiments were conducted in a leaky, poorly heated shed with almost no proper equipment. *Nonetheless*, it was there that she and Pierre Curie discovered two new elements.|Therefore,Specifically,Similarly|The poet's work sold poorly during her lifetime; *nonetheless*, critics today regard her as a major voice of her era.|||cs|it was there that she and Pierre Curie discovered two new elements|Terrible conditions, yet a major discovery → concession → Nonetheless.",
"whereas|conj.|반면에|while on the other hand; contrasts two facts within one sentence|Some birds migrate thousands of miles each year, *whereas* others stay in the same area their whole lives.|Mammals such as humans maintain a steady body temperature regardless of their surroundings, *whereas* reptiles such as lizards must bask in the sun to warm their bodies.|because,so,since|Coal releases large amounts of carbon dioxide, *whereas* solar panels produce electricity without burning fuel.|||ct|reptiles such as lizards must bask in the sun to warm their bodies|Steady body temperature vs. depending on the sun → two contrasting facts → whereas.",
"although|conj.|비록 ~이지만|even though; introduces a contrast within one sentence|*Although* the drought lasted for three years, the ancient city's reservoirs kept its people supplied with water.|*Although* the painter Vincent van Gogh sold only a handful of works during his lifetime, his paintings now sell for tens of millions of dollars.|Because,Since,Once|*Although* the treaty was signed in 1648, fighting continued in some regions for months.|||cs|his paintings now sell for tens of millions of dollars|Sold almost nothing then vs. extremely valuable now → contrast within one sentence → Although.",
"despite|prep.|~에도 불구하고|without being prevented by something (followed by a noun)|*Despite* its small size, the hummingbird can fly hundreds of miles without stopping.|*Despite* decades of research, scientists still cannot fully explain why humans need to sleep, though they agree it is essential for memory and health.|Because of,Due to,Thanks to|*Despite* strong public support, the bill failed to pass the Senate.|||cs|scientists still cannot fully explain why humans need to sleep|Lots of research should have produced an answer, but it hasn't → Despite.",
"instead|transition|대신에|in place of something; introduces the alternative that actually happened|The researchers did not rely on surveys. *Instead*, they observed the students' behavior directly.|The architect rejected the idea of tearing down the old train station to build a modern terminal. *Instead*, she proposed restoring the original building and adding a glass extension behind it.|Similarly,For example,Moreover|Rather than building a new dam, the town *instead* restored the wetlands that naturally absorbed floodwater.|||al|she proposed restoring the original building|Rejects one plan and gives the plan that replaced it → Instead.",
"alternatively|transition|그 대신, 또 다른 방법으로|as another option or possibility|Doctors may treat the condition with medication. *Alternatively*, they may recommend changes in diet and exercise.|One explanation for the unusual tracks is that a single large dinosaur made them while limping. *Alternatively*, the tracks may have been made by two smaller dinosaurs walking side by side.|Therefore,Likewise,As a result|Students may submit a written report or, *alternatively*, give a short presentation.|||al|the tracks may have been made by two smaller dinosaurs|A second possible explanation for the same tracks → Alternatively.",
"in contrast|transition|대조적으로|introduces something very different from what was just described|Urban populations in the region grew rapidly. *In contrast*, rural areas lost nearly a fifth of their residents.|In the early twentieth century, most American homes were heated by burning coal or wood. *In contrast*, the majority of homes today rely on natural gas or electricity.|Similarly,For example,As a result|The northern slope of the mountain is covered in forest; the southern slope, *in contrast*, is almost bare rock.|||ct|the majority of homes today rely on natural gas or electricity|Coal and wood then vs. gas and electricity now → In contrast.",
"on the contrary|transition|오히려, 그와는 반대로|rejects the previous statement and asserts the opposite|The new policy did not reduce traffic. *On the contrary*, congestion grew worse.|Many people assume that the Great Wall of China is easily visible from space. *On the contrary*, astronauts report that it is nearly impossible to see without aid, since it is very narrow and similar in color to the land around it.|As a result,In addition,Similarly|The critic did not dislike the film; *on the contrary*, she called it the best of the year.|||ct|astronauts report that it is nearly impossible to see without aid|Rejects a common belief and states the opposite is true → On the contrary.",
"therefore|transition|그러므로|for that reason; introduces a logical conclusion|The two samples came from the same rock layer. *Therefore*, they are likely to be about the same age.|Honeybees pollinate roughly a third of the crops that humans eat, including apples, almonds, and blueberries. A sharp decline in bee populations could, *therefore*, threaten the global food supply.|however,instead,similarly|The patient's symptoms did not improve; the doctors *therefore* changed the treatment.|||rs|threaten the global food supply|Bees are needed for many crops, so their decline leads to this conclusion → therefore.",
"thus|transition|따라서|as a result; introduces a consequence or conclusion|Mercury has almost no atmosphere to trap heat. *Thus*, its nighttime temperatures drop far below freezing.|The ice-covered surface of Jupiter's moon Europa appears to sit on top of a vast ocean of liquid water. Europa is *thus* considered one of the most promising places to search for life beyond Earth.|however,similarly,instead|The factory switched to solar power and *thus* cut its energy costs in half.|||rs|considered one of the most promising places to search for life|Liquid water is needed for life, so this conclusion follows → thus.",
"hence|transition|그러므로, 이런 이유로|for this reason; introduces a result|The mineral glows under ultraviolet light; *hence*, it is easy to identify in the field.|The Dead Sea is so salty that its water is far denser than ordinary seawater. Swimmers *hence* float easily on its surface without any effort.|however,nevertheless,instead|The region receives very little rain; *hence* its farmers depend on irrigation.|||rs|so salty that its water is far denser|Very dense water causes easy floating → result → hence.",
"consequently|transition|결과적으로|as a result of what was just described|The river changed its course in the 1600s. *Consequently*, the port city lost most of its trade.|In the 1990s, wolves were reintroduced into Yellowstone National Park, where they began hunting the large elk herds. *Consequently*, young willow and aspen trees, which elk had been eating, began to grow back along the rivers.|However,Similarly,Instead|The company ignored early complaints about the product; *consequently*, sales fell sharply.|||rs|which elk had been eating, began to grow back|Wolves hunted elk → fewer elk eating trees → trees grew back → result → Consequently.",
"accordingly|transition|그에 맞춰, 따라서|in a way that fits the situation just described|Surveys showed that most visitors arrived by bicycle. *Accordingly*, the museum added more bike racks near the entrance.|Meteorologists predicted that the hurricane would reach the coast within thirty-six hours. *Accordingly*, officials ordered residents of low-lying areas to leave their homes.|However,In contrast,Previously|The data revealed that students learned best in the morning, and the school adjusted its schedule *accordingly*.|||rs|officials ordered residents of low-lying areas to leave their homes|The officials acted in response to the prediction → Accordingly.",
"as a result|transition|그 결과|because of this|The region suffered a severe drought. *As a result*, wheat prices rose sharply.|In the nineteenth century, the invention of the steam-powered printing press made books and newspapers far cheaper to produce. *As a result*, reading material became available to millions of ordinary people for the first time.|However,For example,On the contrary|Many factories moved overseas; *as a result*, the town's population declined.|||rs|reading material became available to millions of ordinary people|Cheaper printing caused wider access → As a result.",
"moreover|transition|더욱이|in addition, and more importantly; adds a stronger supporting point|The new vaccine is highly effective. *Moreover*, it can be stored without refrigeration.|Planting trees along city streets lowers summer temperatures by providing shade. *Moreover*, the trees absorb pollutants from the air, improving residents' health.|However,Instead,Otherwise|The plan is affordable; *moreover*, it can be completed in a single year.|||ad|the trees absorb pollutants from the air|A second benefit that supports the same argument → adds → Moreover.",
"furthermore|transition|게다가|in addition; adds another point in the same direction|The theory explains the existing data. *Furthermore*, it correctly predicted the results of a new experiment.|Learning a second language improves children's ability to switch between tasks. *Furthermore*, studies suggest that bilingual adults may develop memory problems later in life than adults who speak only one language.|However,Instead,Nevertheless|The policy reduced crime; *furthermore*, it saved the city money.|||ad|bilingual adults may develop memory problems later in life|Another benefit of learning a second language → Furthermore.",
"additionally|transition|추가로|also; adds another piece of information|The museum restored the painting's colors. *Additionally*, it repaired the original wooden frame.|The new library building uses solar panels to generate most of its electricity. *Additionally*, it collects rainwater from its roof to water the surrounding gardens.|However,Therefore,In contrast|Participants completed a survey; *additionally*, they took a short memory test.|||ad|it collects rainwater from its roof|Another eco-friendly feature of the same building → Additionally.",
"in addition|transition|그뿐만 아니라|also; adds information|The program offers free meals to students. *In addition*, it provides after-school tutoring.|The Nile River supplied ancient Egyptian farmers with water for their crops. *In addition*, its yearly floods left behind rich soil that made the land extremely fertile.|However,Instead,As a result|The city built new bike lanes. *In addition*, it lowered the speed limit downtown.|||ad|its yearly floods left behind rich soil|A second way the Nile helped farmers → In addition.",
"likewise|transition|마찬가지로|in the same way; shows similarity|The author's first novel was set in rural Georgia. *Likewise*, her second book takes place in a small southern town.|Some desert plants store water in their thick stems to survive long dry periods. *Likewise*, camels store fat in their humps, which their bodies can convert into energy and water when food is scarce.|However,Instead,Therefore|The coach demanded discipline from her players and held herself to that standard *likewise*.|||sm|camels store fat in their humps|Plants and camels both store resources to survive dryness → same way → Likewise.",
"similarly|transition|유사하게, 비슷하게|in a similar way; shows a comparison|Bats use echoes to locate their prey. *Similarly*, dolphins send out clicks to find fish in dark water.|In the 1800s, many people feared that railroads would harm human health because of their unprecedented speed. *Similarly*, some critics in the early 2000s claimed that smartphones would permanently damage people's ability to concentrate.|However,Therefore,Instead|Ancient Rome built roads to connect its empire; the Inca *similarly* built thousands of miles of mountain trails.|||sm|some critics in the early 2000s claimed that smartphones would|Two parallel fears about new technology → Similarly.",
"meanwhile|transition|한편, 그동안에|at the same time; introduces something happening alongside|Factory output in the city doubled between 1900 and 1920. *Meanwhile*, air quality worsened dramatically.|During the 1960s, American and Soviet engineers raced to land the first humans on the Moon. *Meanwhile*, scientists in both countries were quietly sharing weather data from their new satellites.|Therefore,For example,Similarly|The senators debated the bill for weeks; *meanwhile*, public support for it continued to grow.|||sq|scientists in both countries were quietly sharing weather data|Something else happening during the same period → Meanwhile.",
"subsequently|transition|그 후에|afterward; later in time|The manuscript was lost in a fire in 1731. Scholars *subsequently* reconstructed parts of it from earlier copies.|In 1928, Alexander Fleming noticed that mold had killed the bacteria growing in one of his dishes. Other scientists *subsequently* developed this mold into penicillin, the first widely used antibiotic.|previously,initially,similarly|The species was declared extinct in 1950 but was *subsequently* rediscovered in a remote valley.|||sq|developed this mold into penicillin|Fleming's observation came first, then later development → subsequently.",
"previously|transition|이전에|before the time being discussed|The building now houses a library. It had *previously* served as a courthouse.|Today the island is home to thriving populations of seabirds. *Previously*, rats that had arrived on ships ate most of the birds' eggs, but a program to remove the rats ended in 2012.|Subsequently,Consequently,Similarly|The scientist had *previously* worked on vaccines before turning to cancer research.|||sq|rats that had arrived on ships ate most of the birds' eggs|Describes the earlier situation before today's → Previously.",
"initially|transition|처음에는|at first|*Initially*, the theory was dismissed by most experts, but new evidence gradually changed their minds.|When the Eiffel Tower was completed in 1889, many Parisian artists and writers *initially* called it ugly and demanded that it be torn down. Today, it is the most beloved symbol of the city.|finally,consequently,moreover|The company *initially* sold only books before expanding into other products.|||sq|Today, it is the most beloved symbol of the city|First reaction vs. today's view → at first → initially.",
"eventually|transition|결국, 마침내|in the end, after a long time or process|The two countries negotiated for years and *eventually* signed a peace treaty.|For centuries, people in Europe believed that the Sun moved around Earth. Through careful observation and debate, scientists *eventually* accepted that Earth orbits the Sun.|previously,initially,similarly|The small startup struggled for years but *eventually* became one of the largest companies in the country.|||sq|Through careful observation and debate|After a long process the change finally happened → eventually.",
"indeed|transition|실제로, 정말로|in fact; confirms and strengthens a previous statement|Critics predicted the play would be a success. It was *indeed* performed to sold-out crowds for two years.|The economist warned that rising housing costs were pushing young families out of the city. *Indeed*, census data showed that the number of children under five living there had fallen by nearly 20 percent in a decade.|However,Instead,Otherwise|The forest is enormous; *indeed*, it is larger than some countries.|||em|census data showed that the number of children under five living there had fallen|Data confirms the warning → in fact → Indeed.",
"notably|transition|특히, 눈에 띄게|especially; points out an important example|Several Renaissance artists studied human anatomy, *notably* Leonardo da Vinci, who dissected more than thirty bodies.|Many plants contain chemicals that have become important medicines, *notably* the Pacific yew tree, whose bark provides a drug used to treat certain cancers.|however,therefore,instead|The region produces many crops, *notably* rice and sugarcane.|||em|whose bark provides a drug used to treat certain cancers|Singles out a striking example from the group → notably.",
"granted|transition|물론 ~이긴 하지만|it is true (concedes a point before making a counterargument)|*Granted*, the new stadium was expensive, but it has brought thousands of visitors and new businesses to the area.|*Granted*, electric cars currently cost more to buy than gasoline-powered cars. Over the life of the vehicle, however, owners often save money because electricity is cheaper than gasoline and repairs are less frequent.|Therefore,Similarly,Meanwhile|*Granted*, the study was small, but its results were striking.|||cs|Over the life of the vehicle, however, owners often save money|Admits a weakness (higher price), then argues the opposite (long-term savings) → Granted.",
"otherwise|transition|그렇지 않으면|if not; or else (shows what would happen in a different case)|Seeds must be stored in a cool, dry place. *Otherwise*, they may rot before planting season.|Bridges in earthquake zones are built on flexible supports that let them sway slightly during a quake. *Otherwise*, the ground's sudden movements could crack the rigid structures.|Similarly,Moreover,For example|The vaccine must be kept cold; *otherwise*, it loses its effectiveness.|||al|the ground's sudden movements could crack the rigid structures|What would happen without the flexible supports → Otherwise.",

function pickNew(p, stage, n){
  const fresh = stage.words.filter(w=>!p.words[w.id]);
  if(!PRIO[stage.id]) return fresh.slice(0,n).map(w=>w.id);
  const learned = stage.words.length - fresh.length;
  // early: mostly core words; later: standard words and some rare words are mixed in
  const W = learned<100 ? {1:7,2:3,3:0} : learned<300 ? {1:5,2:4,3:1} : {1:4,2:4,3:1};
  const q = {1:[],2:[],3:[]}; fresh.forEach(w=>q[tierOf(w)].push(w.id));
  const out=[];
  while(out.length<n){
    let ks=[1,2,3].filter(k=>q[k].length && W[k]>0);
    if(!ks.length) ks=[1,2,3].filter(k=>q[k].length);
    if(!ks.length) break;
    const tot=ks.reduce((a,k)=>a+(W[k]||1),0); let r=Math.random()*tot, k=ks[ks.length-1];
    for(const x of ks){ r-=(W[x]||1); if(r<0){ k=x; break; } }
    out.push(q[k].shift());
  }
  return out;
}

const FIDX = {}; FAMS.forEach((f,i)=>{ FIDX[f[0]]=i; f[3].forEach(m=>{ if(!(m[0] in FIDX)) FIDX[m[0]]=i; }); });
const famOf = w=> (w && (w.w in FIDX)) ? FAMS[FIDX[w.w]] : null;
const LV = {e:1,m:2,h:3,s:4};
const APPW = {}; Object.values(WORDS).forEach(o=>{ if(!APPW[o.w] || APPW[o.w].stage==="c") APPW[o.w]=o; });
// quiz items a word may get: only for the main vocabulary stages and only up to that stage's level
function famItems(w){
  const f=famOf(w); if(!f || !LV[w.stage]) return [];
  const base=APPW[f[0]], bl = base ? (LV[base.stage]||LV[w.stage]) : LV[w.stage];
  return f[4].filter(q=> (q[2] ? LV[q[2]] : bl) <= LV[w.stage]);
}
const POSN = {"n.":"noun","v.":"verb","adj.":"adjective","adv.":"adverb","prep.":"preposition","conj.":"conjunction"};
function relLabel(w, pos, f){
  const forms=[f[0]].concat(f[3].map(m=>m[0]));
  const pre=(w.match(/^(over|under|un|in|im|ir|il|dis|non|mis|re)/)||[])[0];
  if(pre){ const rest=w.slice(pre.length);
    if(forms.some(x=>x!==w && (x===rest || (rest.length>4 && x.slice(0,5)===rest.slice(0,5))))){
      if(pre==="mis") return "“mis-” = wrongly";
      if(pre==="im" && /^migr/.test(rest)) return "“im-” = into";
      if(pre==="over"||pre==="under") return `“${pre}-” = too ${pre==="over"?"much":"little"}`;
      if(pre==="re") return "“re-” = again";
      return `“${pre}-” = not / opposite`;
    } }
  const p=(POSN[pos]||pos.replace(/\.$/,""));
  return p ? p+" form" : "";
}
function famExample(x){
  const o=APPW[x]; return o ? o.ex : "";   // only real card sentences (quiz sentences are never shown here, so answers stay hidden)
}
function famHTML(w, open){
  const f=famOf(w); if(!f) return "";
  const row=(x,pos,ko,adv,note,isBase)=>{
    const ex=famExample(x), me=x===w.w;
    return `<div class="frow${adv?' fadv':''}${me?' fme':''}"><div class="fl"><b class="en">${esc(x)}</b><span class="fpos en">${esc(POSN[pos]||pos)}</span><span class="note">${esc(ko)}</span>${APPW[x]?'<span class="fin" title="also in the Word Book">📖</span>':''}</div>
      <div class="frel en">${isBase?'base word':esc(relLabel(x,pos,f))}${adv?' · advanced':''}${me?' · ← you are studying this':''}</div>
      ${note?`<div class="fnote en">💡 ${esc(note)}</div>`:''}
      ${ex&&!isBase?`<div class="fex en">${esc(ex).replace(/\*(.+?)\*/,'<b>$1</b>')}</div>`:''}</div>`;
  };
  const main=f[3].filter(m=>!m[3]), adv=f[3].filter(m=>m[3]);
  return `<details class="fam" ${open?"open":""}><summary>👪 Word Family of “${esc(f[0])}” · ${f[3].length+1} forms</summary>
    ${row(f[0],f[1],f[2],0,"",1)}${main.map(m=>row(m[0],m[1],m[2],0,m[4],0)).join("")}
    ${adv.length?`<details class="fmore"><summary>More forms (advanced) · ${adv.length}</summary>${adv.map(m=>row(m[0],m[1],m[2],1,m[4],0)).join("")}</details>`:""}
    <div class="note" style="margin-top:6px">Same root, different jobs in a sentence. You don't need to memorize them all — 📖 = also a word in the Word Book.</div></details>`;
}

/* ---------- Mission ---------- */
let M=null;
function startMission(){
  const p=P();
  const daily = p.daily||5;
  const reviews = dueList(p).slice(0, Math.max(6, daily+2));
  const stage = STAGES.find(s=>s.id===p.stage);
  const news = pickNew(p, stage, daily);
  if(!reviews.length && !news.length){
    render(`<div class="card" style="text-align:center"><div class="big">🏆</div>
      <div style="font-size:22px">You learned every word in this stage!</div>
      <p class="note">No reviews today. Pick another stage!</p>
      <button class="btn" onclick="screenHome()">Home</button></div>`); return;
  }
  const qs=[];
  const ts=[];
  let famN=0;   // at most 3 word-family questions per mission
  const isCtx = id=> WORDS[id].stage==="c";
  const hasSyn = id=> !isCtx(id) && WORDS[id].syn && WORDS[id].sdis.length>=3;
  const listenOK = id=> canSay && (WORDS[id].stage==="e" || WORDS[id].stage==="m");
  news.forEach(id=>{
    if(isCtx(id)){ qs.push({id,t:"nearly"}); return; }
    qs.push({id,t:"mean"}); qs.push({id,t:"fill"});
    if(famItems(WORDS[id]).length && famN<3){ famN++; qs.push({id,t:"fam"}); }
    if(hasSyn(id)) qs.push({id,t:"syn"});
    if(listenOK(id)) ts.push({id,t:"listen"});
    ts.push({id,t:"type"});
  });
  reviews.forEach(id=>{ const r=p.words[id];
    if(isCtx(id)){ qs.push({id,t:"nearly"}); return; }
    const canFam = famItems(WORDS[id]).length && famN<3 && Math.random()<.25;
    if(canFam){ famN++; qs.push({id,t:"fam"}); }
    else if(r.box<3) qs.push({id, t: pick(hasSyn(id)?["mean","fill","syn"]:["mean","fill"])});
    else if(hasSyn(id) && Math.random()<.5) qs.push({id,t:"syn"});
    ts.push({id,t:"type"}); });
  M={news, reviews, all:[...news,...reviews], learnI:0, q:[...shuffle(qs), ...shuffle(ts)], qi:0, ok:{}, retried:{}, coins:0, combo:0, right:0, total:0};
  M.all.forEach(id=>M.ok[id]=true);
  if(news.length) screenLearn(); else screenQuiz();
}

  const w=WORDS[M.news[M.learnI]];
  render(`

      <div class="mean-ko">${esc(w.ko)}</div>
      <div class="ex en">${exHTML(w)} ${sayBtn(w.ex.replace(/\*/g,""))}</div>

// what kind of change the word has in its example: base, s, ed (past / past participle), ing
function infl(x){
  const f=x.form.toLowerCase(), b=x.w.toLowerCase();
  if(f===b) return "base";
  if(f.endsWith("ing") && !b.endsWith("ing")) return "ing";
  if((f.endsWith("s") && !b.endsWith("s")) || f===b+"es") return "s";
  return "ed";
}
const posKey = x=> x.pos.replace(/[^a-z]/g,"").slice(0,3);
// wrong choices that are changed the same way as the answer (taken from their own example sentences)
function formDistractors(w, n=3){
  const k=infl(w), pk=posKey(w);
  const same = x=> x.id!==w.id && infl(x)===k && posKey(x)===pk && x.form.toLowerCase()!==w.form.toLowerCase();
  let pool = STAGES.find(s=>s.id===w.stage).words.filter(same);
  if(pool.length<n) pool = pool.concat(Object.values(WORDS).filter(x=>same(x) && x.stage!==w.stage));
  return shuffle(pool).slice(0,n);
}
function formText(x, cap){
  const f=x.form.toLowerCase();
  return cap ? f[0].toUpperCase()+f.slice(1) : f;
}
function distractors(w, field, n=3){
  const pool = STAGES.find(s=>s.id===w.stage).words.filter(x=>x.id!==w.id && x[field]!==w[field] && (!isTr(w) || x.ctype!==w.ctype));
  if(isTr(w)){ const seen=new Set(), out=[]; shuffle(pool).forEach(x=>{ if(out.length<n && !seen.has(x.ctype)){ seen.add(x.ctype); out.push(x); } }); return out; }
  return shuffle(pool).slice(0,n);
}

function screenQuiz(){
  if(M.qi>=M.q.length) return screenBonus();
  const q=M.q[M.qi], w=WORDS[q.id], r=P().words[q.id];
  const boss = isBoss(r);
  const tag = boss? `<span class="tag boss">👾 BOSS WORD · 2x coins</span>` : (M.news.includes(q.id)? `<span class="tag new">NEW</span>`:`<span class="tag">🔁 Review</span>`);
  const prog = `<div class="bar grow"><i style="width:${M.qi/M.q.length*100}%;background:var(--orange)"></i></div>`;
  let body="";
  if(q.t==="mean"){
    const opts = shuffle([w, ...distractors(w,"en")]);
    body = `<div class="note" style="text-align:center">What does it mean?</div>
      <div class="word en">${esc(w.w)}${sayBtn(w.w)}</div>
      <div class="ex en" style="font-size:18px">${qHTML(w)} ${sayBtn(w.qex.replace(/\*/g,""))}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.id===w.id}" onclick="answer(this)"><span class="en">${esc(o.en)}</span><span class="mk">${esc(o.ko)}</span></button>`).join("")}</div>`;
  } else if(q.t==="fill"){
    const before = w.qex.slice(0, w.qex.indexOf("*")).trim();
    const cap = /^[A-Z]/.test(w.qform) && (before==="" || /[.!?]$/.test(before));
    const fix = t=> cap ? t[0].toUpperCase()+t.slice(1) : t.toLowerCase();

function listenCheck(){

function typeCheck(){
  const q=M.q[M.qi], w=WORDS[q.id];
  const v=($("sp").value||"").trim().toLowerCase(); if(!v) return;
  const f=w.tform.toLowerCase(), base=w.w.toLowerCase();
  if(v===f) return resolveQ(true, "type");
  if(v===base && base!==f) return resolveQ(true, "base");
  if(!M.hint.close && f.length>=4 && lev(v,f)===1){
    M.hint.close=true; buzz();
    $("hintbox").innerHTML+=`<div class="fb no" style="margin-top:8px">🤏 So close! Check your spelling and try again.</div>`;

  resolveQ(false, "type");
}

  const q=M.q[M.qi], w=WORDS[q.id], r=P().words[q.id];
  M.total++; beep(ok);
  if(q.t==="type"||q.t==="listen"){ ["sp","h1","h2"].forEach(x=>{ const e=$(x); if(e) e.disabled=true; }); const b=document.querySelector("#qc form button"); if(b) b.disabled=true; }
  let msg;
