    const it=M.fi, ans=it[0].match(/\*(.+?)\*/)[1], sent=esc(it[0]).replace(/\*(.+?)\*/,'<span class="hl">$1</span>');
    const f=famOf(w), A=ans.toLowerCase(), row=[[f[0],f[1],f[2]]].concat(f[3]).find(x=>x[0]===A||x[0]+"s"===A||x[0]+"es"===A);
    const info = row ? ` <span class="note en">(${esc(POSN[row[1]]||row[1])} · ${esc(row[2])})</span>` : "";
    if(ok){ M.right++; M.combo++; let c=10*(isBoss(r)?2:1); if(M.combo%3===0){ c+=10; flash(`🔥 ${M.combo} COMBO! +10`); } M.coins+=c;
      msg=`<div class="fb ok">⭕ Correct! +${c} 🪙<div class="en" style="margin-top:6px">${sent}</div><div>${esc(ans)}${info}</div>${famHTML(w,true)}</div>`; }
    else { M.combo=0; if(!M.retried[q.id+q.t]){ M.retried[q.id+q.t]=1; M.q.push({...q}); } M.ok[q.id]=false;
      msg=`<div class="fb no">❌ The answer is <b class="en">${esc(ans)}</b>${info}<div class="en" style="margin-top:6px">${sent}</div>${famHTML(w,true)}<div class="note">You'll see this one again soon!</div></div>`; }
    $("fb").innerHTML = msg + `<button class="btn ${ok?'green':''}" style="margin-top:12px" onclick="M.qi++;screenQuiz()">Next ▶</button>`;
    $("fb").scrollIntoView({behavior:"smooth",block:"nearest"}); return;
  }
  if(ok){
    M.right++; M.combo++;
    let c = 10 * (isBoss(r)?2:1);
    if(q.t==="listen") c = 15 * (isBoss(r)?2:1);
    if(q.t==="type"){
      c = 20 * (isBoss(r)?2:1) - (M.hint.mean?5:0) - (M.hint.hear?5:0) - (how==="base"?5:0);
      c = Math.max(c,5);
    }
    if(M.combo>0 && M.combo%3===0){ c+=10; flash(`🔥 ${M.combo} COMBO! +10`); }
    const sent = q.t==="nearly" ? ctxExplain(w) : q.t==="type" ? tHTML(w) : q.t==="listen" ? `<b>${esc(w.w)}</b> = ${esc(w.en)} <span class="note">(${esc(w.ko)})</span>` : q.t==="syn" ? `<b>${esc(w.w)}</b> ≈ <b>${esc(w.syn)}</b> · ${clueHTML(w)}` : clueHTML(w);
    const note = how==="base" ? `<div class="note">✔ Right word! In this sentence it's <b class="en">${esc(w.tform.toLowerCase())}</b>.</div>` : "";
    M.coins+=c; msg=`<div class="fb ok">⭕ Correct! +${c} 🪙${note}<div class="en" style="margin-top:6px">${sent}</div>${q.t==="fill"?explainHTML(w):""}</div>`;
  } else {
    M.combo=0;
    if(!M.retried[q.id+q.t]){ M.retried[q.id+q.t]=1; M.q.push({...q}); }
    M.ok[q.id]=false;
    if(q.t==="nearly"){ M.combo=0; if(!M.retried[q.id+q.t]){ M.retried[q.id+q.t]=1; M.q.push({...q}); } M.ok[q.id]=false;
      $("fb").innerHTML = `<div class="fb no">❌ The answer is <b class="en">${esc(w.syn)}</b>${ctxExplain(w)}<div class="note">You'll see this one again soon!</div></div><button class="btn" style="margin-top:12px" onclick="M.qi++;screenQuiz()">Next ▶</button>`;
      $("fb").scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
    const af = (q.t==="type"? w.tform : q.t==="listen"? w.w : q.t==="syn"? w.syn : w.qform).toLowerCase();
    msg=`<div class="fb no">❌ The answer is <b class="en">${esc(af)}</b>${af!==w.w.toLowerCase()?` <span class="note en">(${esc(w.w)})</span>`:""} = <span class="en">${esc(w.en)}</span> <span class="note">(${esc(w.ko)})</span><div class="en" style="margin-top:6px">${q.t==="type"?tHTML(w):clueHTML(w)}</div>${(q.t==="fill"||q.t==="mean")?explainHTML(w):""}<div class="note">You'll see this one again soon!</div></div>`;
  }
  $("fb").innerHTML = msg + `<button class="btn ${ok?'green':''}" style="margin-top:12px" onclick="M.qi++;screenQuiz()">Next ▶</button>`;
  $("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function grammarCheck(text){
  // Free public LanguageTool API (no key). Returns list of {offset,length,message,rep}
  const body = new URLSearchParams({text, language:"en-US"});
  const ctl = new AbortController(); const tm=setTimeout(()=>ctl.abort(),8000);
  try{
    const r = await fetch("https://api.languagetool.org/v2/check",{method:"POST",body,signal:ctl.signal});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    return j.matches.map(m=>({offset:m.offset,length:m.length,message:m.message,rep:(m.replacements[0]||{}).value}));
  } finally { clearTimeout(tm); }
}
function applyFixes(t, ms){
  let out=t; ms.slice().sort((x,y)=>y.offset-x.offset).forEach(m=>{ if(m.rep!=null) out=out.slice(0,m.offset)+m.rep+out.slice(m.offset+m.length); });
  return out;
}
function markErrors(t, ms){
  let html="", i=0;
  ms.slice().sort((x,y)=>x.offset-y.offset).forEach(m=>{ if(m.offset<i) return;
    html+=esc(t.slice(i,m.offset))+`<span style="background:#ffd0d2;text-decoration:underline wavy var(--red)">${esc(t.substr(m.offset,m.length)||" ")}</span>`; i=m.offset+m.length; });
  return html+esc(t.slice(i));
}
let checking=false;
async function checkMine(){
  if(checking) return;
  const w=WORDS[M.bonus]; let t=($("mine").value||"").trim();
  const stem = w.w.toLowerCase().slice(0, Math.max(4, w.w.length-2));
  const words = t.split(/\s+/).filter(Boolean).length;
  if(!t.toLowerCase().includes(stem)){ $("fb").innerHTML=`<div class="fb no">Use the word <b class="en">${esc(w.w)}</b> in your sentence!</div>`; return; }
  if(words<5){ $("fb").innerHTML=`<div class="fb no">A little longer, please! (5+ words)</div>`; return; }
  checking=true; $("fb").innerHTML=`<div class="fb">🔎 Checking grammar...</div>`;
  let ms=null;
  try{ ms = await grammarCheck(t); }catch(e){ ms=null; }
  checking=false;
  if(ms===null){
    $("fb").innerHTML=`<div class="fb">⚠️ Grammar check isn't available right now. You still get the bonus!</div>`;
    return bonusDone(t,30,false);
  }
  if(!ms.length){ $("fb").innerHTML=`<div class="fb ok">✅ Perfect grammar!</div>`; return bonusDone(t, M.bonusTry?30:40, true); }
  const fixed = applyFixes(t, ms);
  M.bonusTry=(M.bonusTry||0)+1;
  $("fb").innerHTML=`<div class="fb no">
      <div>✏️ Let's fix it!</div>
      <div class="en" style="margin-top:8px">${markErrors(t,ms)}</div>
      <div class="en" style="margin-top:8px;background:#d8f8e2;border-radius:10px;padding:8px">👉 ${esc(fixed)}</div>
      <ul class="note en" style="margin:8px 0 0;padding-left:20px">${ms.slice(0,4).map(m=>`<li>${esc(m.message)}</li>`).join("")}</ul>
      <div class="note" style="margin-top:6px">Rewrite it yourself and submit for +30, or finish now for +20.</div>

        <button class="btn blue small" onclick="$('mine').focus()">Rewrite ✍️</button>
      </div></div>`;
}

function buzz(){ // "boo-boo" sound
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    [0,.28].forEach(t=>{ const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
      o.type="sawtooth"; o.frequency.value=140; g.gain.value=.08; o.start(AC.currentTime+t); o.stop(AC.currentTime+t+.2); });
  }catch(e){}
}
function hatch(){

  const tabs=STAGES.map(x=>`<button class="pill" style="${x.id===sid?'background:var(--yellow)':''}" onclick="screenBook('${x.id}')">${bookLabel(x.id)}</button>`).join(" ");
  const q=(window.__bq||"").toLowerCase();
  const list=s.words.slice().sort((a,b)=>a.w.localeCompare(b.w)).filter(w=>!q||w.w.includes(q)||w.ko.includes(q)||w.en.toLowerCase().includes(q));
  const rows=list.map(w=>{ const r=p.words[w.id];
    const st = !r?'⬜':isBoss(r)?'👾':r.box>=4?'⭐':'🟩';
    return `<div class="it">${st}<b>${esc(w.w)}</b><span>${esc(w.en)}<br><small>${esc(w.ko)}</small></span>${sayBtn(w.w)}</div>`;}).join("");
  render(`<div class="top"><button class="back" onclick="screenHome()">◀</button><b style="font-size:20px">📖 Word Book</b></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${tabs}</div>
    <input type="text" id="bq" class="en" placeholder="🔍 Search words or meanings" value="${esc(window.__bq||"")}" oninput="window.__bq=this.value;clearTimeout(window.__bt);window.__bt=setTimeout(()=>{screenBook('${sid}');const i=$('bq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
    <p class="note">${bookLabel(s.id)}: ${list.length} of ${s.words.length} · ⬜ new · 🟩 learning · ⭐ mastered · 👾 boss</p>
    <div class="card list en">${rows}</div>`);
}


/* ---------- Backup & restore ---------- */
function backupNote(){
  if(!S.lastBackup) return "💾 No backup yet.";
  const d=today()-S.lastBackup;
  return d===0 ? "💾 Backed up today." : `💾 Last backup: ${d} day${d>1?"s":""} ago.${d>=14?" Time for a new one!":""}`;
}
function backupText(){ return JSON.stringify({app:"wordquest", v:APP_VERSION, saved:new Date().toISOString(), data:S}); }
function backupDone(msg){ S.lastBackup=today(); save(); const m=$("bkmsg"); if(m) m.innerHTML=`<div class="fb ok" style="margin-top:8px">${msg}</div>`; }
function backupDownload(){
  let framed=false; try{ framed = window.top!==window; }catch(e){ framed=true; }
  if(framed) return showCode(backupText());   // inside an embedded preview, downloads are blocked: show the code instead
  try{
    const a=document.createElement("a"); const d=new Date();
    a.href=URL.createObjectURL(new Blob([backupText()],{type:"application/json"}));
    a.download=`wordquest-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    backupDone("✅ Backup file saved. Keep it somewhere safe (email it to yourself or put it in a cloud folder).");
  }catch(e){ backupCopy(); }
}
function backupCopy(){
  const txt=backupText();
  const ok=()=>backupDone("✅ Backup code copied. Paste it into a note or an email to yourself.");
  try{ navigator.clipboard.writeText(txt).then(ok, ()=>showCode(txt)); }catch(e){ showCode(txt); }
}
function showCode(txt){ $("bkmsg").innerHTML=`<p class="note">Copy all of this text and keep it safe:</p><textarea style="width:100%;height:120px;font-size:11px" readonly onclick="this.select()">${esc(txt)}</textarea>`; S.lastBackup=today(); save(); }
function restoreCodeUI(){ $("bkmsg").innerHTML=`<textarea id="rcode" style="width:100%;height:120px;font-size:11px" placeholder="Paste the backup code here"></textarea><button class="btn blue small" style="margin-top:8px" onclick="restoreText($('rcode').value)">Restore</button>`; }
function restoreFile(inp){ const f=inp.files&&inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>restoreText(r.result); r.readAsText(f); }
function restoreText(txt){
  let o=null; try{ o=JSON.parse(String(txt).trim()); }catch(e){}
  const data = o && (o.data||o);
  if(!data || !data.profiles || typeof data.profiles!=="object"){ $("bkmsg").innerHTML=`<div class="fb no" style="margin-top:8px">❌ That doesn't look like a Word Quest backup.</div>`; return; }
  const names=Object.values(data.profiles).map(p=>`${esc(p.name)}: ${Object.keys(p.words||{}).length} words, 🪙${p.coins||0}`).join("<br>");
  $("bkmsg").innerHTML=`<div class="modal"><div class="card" style="text-align:center"><div style="font-size:19px">Replace the progress on this device with this backup?</div><p class="note">${names}</p>
    <div class="row"><button class="btn white small" onclick="$('bkmsg').innerHTML=''">Cancel</button><button class="btn green small" id="rgo">Restore</button></div></div></div>`;
  $("rgo").onclick=()=>{ S=data; S.active=null; Object.values(S.profiles).forEach(p=>{ p.words=p.words||{}; p.pets=p.pets||[]; p.days=p.days||{}; }); save(); screenProfiles(); };
}

/* ---------- Problem reports ---------- */
const FLAGS=["The answer is wrong","Two answers could be right","Spelling / grammar mistake","Explanation is confusing","Something else"];
function flagQ(){
  if(!M || !M.q[M.qi]) return;
  $("flagbox").innerHTML=`<div class="card" style="text-align:left"><b>What's wrong?</b>${FLAGS.map((f,i)=>`<button class="btn white small" style="margin-top:6px" onclick="flagSave(${i})">${f}</button>`).join("")}</div>`;
  $("flagbox").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function flagSave(i){
  const q=M.q[M.qi], w=WORDS[q.id];
  const shown = q.t==="fam" ? (M.fi?M.fi[0]:"") : q.t==="type" ? w.tex : (q.t==="mean"||q.t==="fill"||q.t==="syn"||q.t==="nearly") ? w.qex : w.ex;
  S.reports=S.reports||[];
  S.reports.push({id:q.id, t:q.t, why:FLAGS[i], who:P().name, when:new Date().toISOString().slice(0,10), text:(shown||"").replace(/\*/g,"")});
  save(); $("flagbox").innerHTML=`<div class="note" style="margin-top:6px">🙏 Thanks! A parent will check it.</div>`;
}
function reportsText(){ return (S.reports||[]).map((r,i)=>`${i+1}. [${r.when}] ${r.id} (${r.t}) — ${r.why} — by ${r.who}\n   "${r.text}"`).join("\n"); }
function reportsCard(){
  const R=S.reports||[];
  return `<div class="card"><b>🚩 Reported questions (${R.length})</b>
    ${R.length?`<p class="note">Copy these and send them to whoever maintains the app so the questions can be fixed.</p>
    <div class="note en" style="white-space:pre-wrap;max-height:220px;overflow:auto;background:#f6f6f6;border-radius:10px;padding:8px;font-size:12px">${esc(reportsText())}</div>
    <div class="row" style="margin-top:8px"><button class="btn white small" onclick="try{navigator.clipboard.writeText(reportsText());this.textContent='✅ Copied'}catch(e){}">📋 Copy all</button><button class="btn white small" onclick="S.reports=[];save();screenSettings()">🗑️ Clear list</button></div>`
    :`<p class="note">Nothing reported yet. Kids can tap “🚩 Something wrong with this question?” under any quiz question.</p>`}</div>`;
}
/* ---------- Settings ---------- */
function screenSettings(){
  const prof = Object.entries(S.profiles).map(([k,p])=>`
    <div class="card">
      <label>Name <input type="text" id="n_${k}" value="${esc(p.name)}"></label>
      <label>Grade <input type="text" id="g_${k}" value="${esc(p.grade)}"></label>
      <label>New words per day</label>
      <div class="colors">${[3,5,8,10,15].map(n=>`<button style="width:auto;padding:0 10px;background:${(p.daily||5)===n?'var(--yellow)':'#fff'};font-family:Jua;font-size:16px" onclick="S.profiles['${k}'].daily=${n};save();screenSettings()">${n}</button>`).join("")}</div>
      <label>Character color</label>
      <div class="colors">${COLORS.map(c=>`<button style="background:${c}" class="${p.color===c?'on':''}" onclick="S.profiles['${k}'].color='${c}';save();screenSettings()"></button>`).join("")}</div>
      <button class="btn white small" style="margin-top:12px" onclick="askReset('${k}')">🗑️ Reset ${esc(p.name)}'s progress</button>
    </div>`).join("");
  render(`<div class="top"><button class="back" onclick="saveSettings()">◀ Save</button><b style="font-size:20px">⚙️ Parent settings</b></div>
    ${prof}
    <div class="card"><label>Mission reward message <input type="text" id="rw" value="${esc(S.reward)}"></label>
    <p class="note">Shown with the completion stamp after each mission.</p></div>
    <div class="card"><b>💾 Backup &amp; restore</b>
      <p class="note">Progress lives only in this browser. Clearing browser data or changing devices erases it — save a backup now and then. ${backupNote()}</p>
      <div class="row"><button class="btn blue small" onclick="backupDownload()">⬇️ Save backup file</button><button class="btn white small" onclick="backupCopy()">📋 Copy backup code</button></div>
      <div class="row" style="margin-top:8px"><label class="btn white small" style="text-align:center">📂 Restore from file<input type="file" accept=".json,.txt,application/json" style="display:none" onchange="restoreFile(this)"></label><button class="btn white small" onclick="restoreCodeUI()">⌨️ Restore from code</button></div>
      <div id="bkmsg"></div></div>
    ${reportsCard()}
    <div id="modal"></div>`);
}
function saveSettings(){
  Object.keys(S.profiles).forEach(k=>{ S.profiles[k].name=$("n_"+k).value.trim()||S.profiles[k].name; S.profiles[k].grade=$("g_"+k).value.trim(); });
  S.reward=$("rw").value.trim()||S.reward; save(); screenProfiles();
}
function askReset(k){
  $("modal").innerHTML=`<div class="modal"><div class="card" style="text-align:center">
    <div style="font-size:20px">Delete all words, coins and pets for ${esc(S.profiles[k].name)}?</div>
    <div class="row" style="margin-top:14px"><button class="btn white small" onclick="$('modal').innerHTML=''">Cancel</button>
    <button class="btn small" style="background:var(--red);color:#fff" onclick="doReset('${k}')">Delete</button></div></div></div>`;
}
function doReset(k){ const p=S.profiles[k]; Object.assign(p,{coins:0,xp:0,words:{},pets:[],days:{}}); save(); screenSettings(); }

/* start */
if(S.active && S.profiles[S.active]) screenHome(); else screenProfiles();
</script>
