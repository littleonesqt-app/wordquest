<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Quest 단어 퀘스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:light;
  --bg:#bfe7ff; --ink:#1d2340; --card:#ffffff; --line:#1d2340;
  --green:#3ccf6e; --red:#ff5a5f; --yellow:#ffd23f; --blue:#3d8bff; --purple:#8b5cf6; --orange:#ff8a3d;
  --muted:#6b7394;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Fredoka",system-ui,sans-serif}
body{min-height:100vh;background:
  linear-gradient(180deg,#8fd3ff 0%,#bfe7ff 45%,#9be38f 45.2%,#7fd472 100%) fixed}
.en{font-family:"Fredoka","Jua",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 14px 40px}
button{font-family:inherit;cursor:pointer;border:none;color:var(--ink);-webkit-text-fill-color:currentColor}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:14px 16px;font-size:20px;border:3px solid var(--line);border-radius:14px;box-shadow:0 5px 0 var(--line);background:var(--yellow);color:var(--ink);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.green{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.white{background:#fff}
.btn.small{font-size:16px;padding:10px 12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
h1{font-size:34px;margin:6px 0 2px;text-align:center;text-shadow:0 3px 0 #fff}
.sub{text-align:center;color:var(--muted);margin:0 0 10px;font-size:16px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 10px;font-size:17px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.back{background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 10px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.grow{flex:1}

/* blocky avatar (original) */
.ava{width:64px;height:84px;position:relative;flex:none}
.ava .head{position:absolute;left:14px;top:0;width:36px;height:34px;background:#ffd8a8;border:3px solid var(--line);border-radius:6px}
.ava .head:before,.ava .head:after{content:"";position:absolute;top:11px;width:6px;height:8px;background:var(--line);border-radius:2px}
.ava .head:before{left:8px}.ava .head:after{right:8px}
.ava .body{position:absolute;left:8px;top:36px;width:48px;height:30px;border:3px solid var(--line);border-radius:6px}
.ava .legs{position:absolute;left:14px;top:66px;width:36px;height:18px;background:#3b4a7a;border:3px solid var(--line);border-radius:4px}
.ava.big{transform:scale(1.4);margin:14px 20px}

.prof{display:flex;align-items:center;gap:14px;text-align:left;font-size:22px}
.prof small{display:block;color:var(--muted);font-size:15px}

.bar{height:16px;background:#e7ebf7;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;text-align:left;box-shadow:0 4px 0 var(--line);font-size:17px}
.stage.on{background:#fff6cc;outline:4px solid var(--orange)}
.stage small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}

.island{position:relative;min-height:150px;background:radial-gradient(ellipse at 50% 80%,#ffe6a3 0 55%,#7fd472 56%);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);overflow:visible;padding:16px 8px 26px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pet{font-size:38px;background:none;animation:bob 2.4s ease-in-out infinite;position:relative;padding:2px}
.pet:nth-child(2n){animation-delay:.6s}.pet:nth-child(3n){animation-delay:1.1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bubble{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--line);border-radius:12px;padding:6px 10px;font-size:15px;white-space:nowrap;z-index:5;animation:none}
.empty{color:#4c6b3c;font-size:16px;align-self:center;text-align:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.word{font-size:46px;text-align:center;margin:8px 0 2px;font-weight:700;letter-spacing:.5px}
.pos{text-align:center;color:var(--muted);font-size:16px}
.ko{text-align:center;font-size:28px;margin:10px 0}
.def{text-align:center;color:var(--muted);font-size:17px}
.ex{font-size:20px;line-height:1.45;background:#f3f6ff;border:2px dashed #9aa6d6;border-radius:12px;padding:12px;margin-top:12px}
.hl{background:var(--yellow);padding:0 4px;border-radius:5px}
.blank{display:inline-block;min-width:80px;border-bottom:4px solid var(--line);text-align:center;color:var(--blue)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:13px;font-size:21px;box-shadow:0 4px 0 var(--line);text-align:center}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--red);color:#fff}
.say{background:var(--blue);color:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 10px;font-size:18px;box-shadow:0 3px 0 var(--line);margin-left:6px;vertical-align:middle}
.tag{display:inline-block;font-size:14px;padding:2px 8px;border-radius:999px;border:2px solid var(--line);background:#fff}
.tag.boss{background:var(--purple);color:#fff}
.tag.new{background:var(--yellow)}
.fb{border-radius:14px;padding:12px;margin-top:12px;font-size:19px;border:3px solid var(--line)}
.fb.ok{background:#d8f8e2}.fb.no{background:#ffe0e1}
input[type=text],textarea{width:100%;font-family:"Fredoka",sans-serif;font-size:22px;padding:12px;border:3px solid var(--line);border-radius:12px;margin-top:12px}
textarea{min-height:90px;font-size:19px}
.combo{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-size:36px;color:#fff;text-shadow:0 3px 0 var(--line),0 0 8px var(--line);pointer-events:none;animation:pop 1s forwards;z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.stamp{text-align:center;font-size:24px;background:var(--yellow);border:3px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 0 var(--line);transform:rotate(-2deg)}
.big{font-size:56px;text-align:center}
.list .it{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:2px dashed #d6dbef;font-size:18px}
.list .it:last-child{border:none}
.list .it b{font-family:"Fredoka";min-width:120px}
.list .it span{flex:1;color:var(--muted);font-size:16px}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:30px;text-align:center}
.note{font-size:15px;color:var(--muted);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:440px;width:100%}
label{display:block;margin-top:10px;font-size:16px}
.colors{display:flex;gap:8px;margin-top:6px}
.colors button{width:36px;height:36px;border-radius:10px;border:3px solid var(--line)}
.colors button.on{outline:4px solid var(--orange)}
</style>
</head>
<body>
<div id="app"></div>

const WORDS = {};
STAGES.forEach(s=>{ s.words = s.data.map(line=>{
  const [w,pos,ko,en,ex] = line.split("|");
  const id = s.id+":"+w;
  const form = (ex.match(/\*(.+?)\*/)||[,w])[1];
  const o = {id,w,pos,ko,en,ex,form,stage:s.id};
  WORDS[id]=o; return o; }); });

const KEY = "wordquest_v1";
let mem = null;
function load(){
  try{ const t = localStorage.getItem(KEY); if(t) return JSON.parse(t);}catch(e){}
  return mem || {
    profiles:{
      a:{name:"막내", grade:"6학년", color:"#ff6b3d", stage:"e", daily:5, coins:0, xp:0, words:{}, pets:[], days:{}},

    },

  };
}

function save(){ mem = S; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const P = ()=>S.profiles[S.active];
function today(){ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); }
function streak(p){
  let t=today(), n=0;
  if(!p.days[t]) t--;
  while(p.days[t]){ n++; t--; }
  return n;
}
const level = p=> Math.floor(p.xp/200)+1;
const isBoss = r => r && r.wrong>=2 && r.box<3;
const esc = s=> String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a=> a[Math.floor(Math.random()*a.length)];
const $ = id=>document.getElementById(id);
const exHTML = w=> esc(w.ex).replace(/\*(.+?)\*/, '<span class="hl">$1</span>');
const exBlank = w=> esc(w.ex).replace(/\*(.+?)\*/, '<span class="blank">?</span>');

/* sound + speech (fail quietly if the browser refuses) */
let AC=null;
function beep(ok){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    o.type="square"; o.frequency.value = ok?880:180; g.gain.value=.06;
    o.start(); if(ok){ o.frequency.setValueAtTime(1320, AC.currentTime+.08); }
    o.stop(AC.currentTime + (ok?.18:.25));
  }catch(e){}
}
const canSay = "speechSynthesis" in window;
function say(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
const sayBtn = t=> canSay ? `<button class="say" onclick="say('${esc(t).replace(/&#39;/g,"\\'")}')">🔊</button>` : "";

function ava(color, big){ return `<div class="ava ${big?'big':''}"><div class="head"></div><div class="body" style="background:${color}"></div><div class="legs"></div></div>`; }

const app = $("app");

function screenProfiles(){
  S.active=null; save();
  const cards = Object.entries(S.profiles).map(([k,p])=>`
    <button class="card prof" style="width:100%" onclick="choose('${k}')">
      ${ava(p.color)}
      <div class="grow">${esc(p.name)} <small>${esc(p.grade)} · Lv.${level(p)} · 🔥${streak(p)}일 · 🪙${p.coins}</small></div>
      <div style="font-size:28px">▶</div>
    </button>`).join("");
  render(`
    <h1>⛏️ Word Quest</h1>
    <p class="sub">단어 퀘스트 · 누가 플레이할까요?</p>
    ${cards}
    <button class="btn white small" onclick="screenSettings()">⚙️ 이름 · 보상 설정 (부모님용)</button>
    <p class="note" style="text-align:center;margin-top:14px">진행 기록은 이 기기의 브라우저에 저장돼요.</p>`);
}
function choose(k){ S.active=k; save(); screenHome(); }

function stageStats(p, s){
  let learned=0, master=0;
  s.words.forEach(w=>{ const r=p.words[w.id]; if(r){ learned++; if(r.box>=4) master++; } });
  return {learned, master, total:s.words.length};
}
function dueList(p){
  const t=today();
  return Object.entries(p.words).filter(([id,r])=>WORDS[id] && r.due<=t)
    .sort((a,b)=> (isBoss(b[1])-isBoss(a[1])) || (a[1].box-b[1].box)).map(x=>x[0]);
}

function screenHome(){
  const p=P(); const lv=level(p); const xpIn=p.xp%200;
  const due=dueList(p).length;
  const doneToday=!!p.days[today()];

  render(`
    <div class="top">
      <button class="back" onclick="screenProfiles()">◀</button>
      <span class="pill">Lv.${lv}</span><span class="pill">🪙 ${p.coins}</span><span class="pill">🔥 ${streak(p)}일</span>
    </div>
    <div class="card" style="display:flex;align-items:center;gap:12px">
      ${ava(p.color)}
      <div class="grow">
        <div style="font-size:24px">${esc(p.name)}</div>
        <div class="bar" style="margin:6px 0 2px"><i style="width:${xpIn/2}%;background:var(--blue)"></i></div>
        <div class="note">다음 레벨까지 ${200-xpIn} XP</div>
      </div>
    </div>
    <div class="card" style="text-align:center">
      <div style="font-size:22px">${doneToday?'✅ 오늘 미션 완료!':'🗡️ 오늘의 미션'}</div>
      <div class="note" style="margin:4px 0 12px">새 단어 ${p.daily||5}개 · 복습할 단어 ${due}개 ${due&&dueList(p).some(id=>isBoss(p.words[id]))?'· 👾 보스 등장!':''} </div>
      <button class="btn green" onclick="startMission()">${doneToday?'한 판 더 하기':'미션 시작 ▶'}</button>
      <div class="note" style="margin-top:8px">${esc(S.reward)}</div>
    </div>
    <h3 style="margin:16px 4px 6px">🏝️ ${esc(p.name)}의 단어 섬</h3>
    <div class="island">${pets}</div>
    <div class="row" style="margin-top:14px">
      <button class="btn purple small" onclick="screenShop()">🥚 알 뽑기</button>
      <button class="btn blue small" onclick="screenBook()">📖 단어장</button>
    </div>
    <h3 style="margin:18px 4px 6px">🗺️ 스테이지</h3>
    <div class="stages">${stages}</div>`);
}
function setStage(id){ P().stage=id; save(); screenHome(); }

function petTalk(el){
  document.querySelectorAll(".bubble").forEach(b=>b.remove());
  const p=P(); const known=Object.keys(p.words).filter(id=>WORDS[id]);
  const b=document.createElement("div"); b.className="bubble";
  if(known.length){ const w=WORDS[pick(known)]; b.innerHTML=`나 <b class="en">${esc(w.w)}</b> 알아! = ${esc(w.ko)}`; }
  else b.textContent="단어 가르쳐줘! 📚";
  el.appendChild(b); setTimeout(()=>b.remove(),2600);
}

/* ---------- Mission ---------- */
let M=null;
function startMission(){
  const p=P();
  const daily = p.daily||5;
  const reviews = dueList(p).slice(0, Math.max(6, daily+2));
  const stage = STAGES.find(s=>s.id===p.stage);
  const fresh = stage.words.filter(w=>!p.words[w.id]).map(w=>w.id);
  const nNew = Math.min(fresh.length, daily);
  const news = fresh.slice(0,nNew);
  if(!reviews.length && !news.length){
    render(`<div class="card" style="text-align:center"><div class="big">🏆</div>
      <div style="font-size:22px">이 스테이지 단어를 다 배웠어요!</div>
      <p class="note">오늘 복습할 단어도 없어요. 다른 스테이지를 골라보세요.</p>
      <button class="btn" onclick="screenHome()">홈으로</button></div>`); return;
  }
  const qs=[];
  news.forEach(id=>{ qs.push({id,t:"mean"}); qs.push({id,t:"fill"}); });
  reviews.forEach(id=>{ const r=p.words[id]; qs.push({id, t: r.box>=3 ? "spell" : (r.box>=2? pick(["fill","spell"]) : pick(["mean","fill"]))}); });
  M={news, reviews, all:[...news,...reviews], learnI:0, q:shuffle(qs), qi:0, ok:{}, retried:{}, coins:0, combo:0, right:0, total:0};
  M.all.forEach(id=>M.ok[id]=true);
  if(news.length) screenLearn(); else screenQuiz();
}

function quitBtn(){ return `<button class="back" onclick="if(window.__q){screenHome()}else{window.__q=1;this.textContent='한번 더 누르면 나가기';setTimeout(()=>window.__q=0,2000)}">✕</button>`; }

function screenLearn(){
  const w=WORDS[M.news[M.learnI]];
  render(`
    <div class="qtop">${quitBtn()}<span class="tag new">NEW 새 단어 ${M.learnI+1}/${M.news.length}</span></div>
    <div class="card">
      <div class="word en">${esc(w.w)}${sayBtn(w.w)}</div>
      <div class="pos en">${esc(w.pos)}</div>
      <div class="ko">${esc(w.ko)}</div>
      <div class="def en">${esc(w.en)}</div>
      <div class="ex en">${exHTML(w)} ${sayBtn(w.ex.replace(/\*/g,""))}</div>
    </div>
    <button class="btn green" onclick="nextLearn()">${M.learnI<M.news.length-1?'다음 단어 ▶':'퀴즈 시작! ⚔️'}</button>`);
  if(canSay) setTimeout(()=>say(w.w),300);
}
function nextLearn(){ M.learnI++; if(M.learnI<M.news.length) screenLearn(); else screenQuiz(); }

function distractors(w, field, n=3){
  const pool = STAGES.find(s=>s.id===w.stage).words.filter(x=>x.id!==w.id && x[field]!==w[field]);
  return shuffle(pool).slice(0,n);
}

function screenQuiz(){
  if(M.qi>=M.q.length) return screenBonus();
  const q=M.q[M.qi], w=WORDS[q.id], r=P().words[q.id];
  const boss = isBoss(r);
  const tag = boss? `<span class="tag boss">👾 BOSS 단어 · 코인 2배</span>` : (M.news.includes(q.id)? `<span class="tag new">NEW</span>`:`<span class="tag">🔁 복습</span>`);
  const prog = `<div class="bar grow"><i style="width:${M.qi/M.q.length*100}%;background:var(--orange)"></i></div>`;
  let body="";
  if(q.t==="mean"){
    const opts = shuffle([w, ...distractors(w,"ko")]);
    body = `<div class="note" style="text-align:center">이 단어의 뜻은?</div>
      <div class="word en">${esc(w.w)}${sayBtn(w.w)}</div>
      <div class="ex en" style="font-size:18px">${exHTML(w)} ${sayBtn(w.ex.replace(/\*/g,""))}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.id===w.id}" onclick="answer(this)">${esc(o.ko)}</button>`).join("")}</div>`;
  } else if(q.t==="fill"){
    const opts = shuffle([w, ...distractors(w,"w")]);
    body = `<div class="note" style="text-align:center">빈칸에 알맞은 단어는? <small>(기본형으로 보여요)</small></div>
      <div class="ex en">${exBlank(w)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt en" data-ok="${o.id===w.id}" onclick="answer(this)">${esc(o.w)}</button>`).join("")}</div>`;
  } else {
    body = `<div class="note" style="text-align:center">뜻을 보고 영어 단어를 직접 써보세요!</div>
      <div class="ko">${esc(w.ko)}</div>
      <div class="ex en">${exBlank(w)}</div>
      <div class="note" style="margin-top:8px">힌트: <b class="en">${esc(w.w[0])}${"_ ".repeat(w.w.length-1)}</b> (${w.w.length}글자)</div>
      <form onsubmit="event.preventDefault();spellCheck()"><input id="sp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here">
      <button class="btn blue" style="margin-top:10px">확인</button></form>`;
  }
  render(`<div class="qtop">${quitBtn()}${prog}<span class="pill">🪙 +${M.coins}</span></div>
    <div style="margin:6px 2px">${tag}</div>
    <div class="card" id="qc">${body}<div id="fb"></div></div>`);
  if(q.t==="spell") setTimeout(()=>{ const i=$("sp"); i&&i.focus(); },100);
}

function answer(btn){
  const ok = btn.dataset.ok==="true";
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.dataset.ok==="true") b.classList.add("right"); });
  if(!ok) btn.classList.add("wrong");
  resolveQ(ok);
}
function spellCheck(){
  const q=M.q[M.qi], w=WORDS[q.id]; const v=($("sp").value||"").trim().toLowerCase();
  if(!v) return;
  const ok = v===w.w.toLowerCase() || v===w.form.toLowerCase();
  $("sp").disabled=true; document.querySelector("#qc form button").disabled=true;
  resolveQ(ok);
}
function resolveQ(ok){
  const q=M.q[M.qi], w=WORDS[q.id], r=P().words[q.id];
  M.total++; beep(ok);
  let msg;
  if(ok){
    M.right++; M.combo++;
    let c = 10 * (isBoss(r)?2:1);
    if(M.combo>0 && M.combo%3===0){ c+=10; flash(`🔥 ${M.combo} COMBO! +10`); }
    M.coins+=c; msg=`<div class="fb ok">⭕ 정답! +${c} 🪙<div class="en" style="margin-top:6px">${exHTML(w)}</div></div>`;
  } else {
    M.combo=0;
    if(!M.retried[q.id+q.t]){ M.retried[q.id+q.t]=1; M.q.push({...q}); }
    M.ok[q.id]=false;
    msg=`<div class="fb no">❌ 정답은 <b class="en">${esc(w.w)}</b> = ${esc(w.ko)}<div class="en" style="margin-top:6px">${exHTML(w)}</div><div class="note">이 문제는 조금 뒤에 다시 나와요!</div></div>`;
  }
  $("fb").innerHTML = msg + `<button class="btn ${ok?'green':''}" style="margin-top:12px" onclick="M.qi++;screenQuiz()">다음 ▶</button>`;
  $("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function flash(t){ const d=document.createElement("div"); d.className="combo"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }

function screenBonus(){
  const w = WORDS[pick(M.all)];
  M.bonus=w.id;
  render(`<div class="qtop">${quitBtn()}<span class="tag new">⭐ 보너스 스테이지 +30 🪙</span></div>
    <div class="card">
      <div class="note" style="text-align:center">이 단어로 나만의 문장을 만들어 보세요!</div>
      <div class="word en">${esc(w.w)}${sayBtn(w.w)}</div>
      <div class="ko" style="font-size:22px">${esc(w.ko)}</div>
      <div class="note">예시: <span class="en">${exHTML(w)}</span></div>
      <textarea id="mine" class="en" placeholder="My sentence..."></textarea>
      <div id="fb"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn white small" onclick="finish()">건너뛰기</button>
        <button class="btn green small" onclick="checkMine()">제출</button>
      </div>
    </div>`);
}
function checkMine(){
  const w=WORDS[M.bonus]; const t=($("mine").value||"").trim();
  const stem = w.w.toLowerCase().slice(0, Math.max(4, w.w.length-2));
  const words = t.split(/\s+/).filter(Boolean).length;
  if(!t.toLowerCase().includes(stem)){ $("fb").innerHTML=`<div class="fb no">문장에 <b class="en">${esc(w.w)}</b>가 들어가야 해요!</div>`; return; }
  if(words<5){ $("fb").innerHTML=`<div class="fb no">조금만 더 길게! (단어 5개 이상)</div>`; return; }
  M.coins+=30; M.mine=t; beep(true); flash("⭐ +30");
  setTimeout(finish,700);
}

function finish(){
  const p=P(), t=today();
  M.all.forEach(id=>{
    const r = p.words[id] || {box:0, wrong:0};
    if(M.ok[id]) r.box=Math.min(5, r.box+1); else { r.box=1; r.wrong=(r.wrong||0)+1; }
    r.due = t + INT[r.box]; p.words[id]=r;
  });
  const firstToday = !p.days[t];
  if(firstToday) M.coins+=20;
  const before=level(p);
  p.coins+=M.coins; p.xp+=M.coins; p.days[t]=true; save();
  const up = level(p)>before;
  const now=new Date();
  render(`
    <div class="card" style="text-align:center">
      <div class="big">${M.right===M.total?'🏆':'🎉'}</div>
      <div style="font-size:26px">미션 클리어!</div>
      <p style="font-size:20px">정답 ${M.right}/${M.total} · 🪙 +${M.coins} ${firstToday?'(오늘 첫 미션 +20 포함)':''}</p>
      ${up?`<p style="font-size:22px;color:var(--purple)">⬆️ 레벨 업! Lv.${level(p)}</p>`:''}
      <p class="note">🔥 연속 ${streak(p)}일째</p>
      ${M.mine?`<div class="ex en" style="text-align:left">✍️ ${esc(M.mine)}</div>`:''}
    </div>
    <div class="stamp">✅ ${esc(p.name)} 오늘 미션 완료<br><span class="note" style="color:var(--ink)">${now.getMonth()+1}/${now.getDate()} ${now.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})}</span><br>${esc(S.reward)}</div>
    <div class="row" style="margin-top:18px">
      <button class="btn purple small" onclick="screenShop()">🥚 알 뽑기</button>
      <button class="btn green small" onclick="screenHome()">홈으로</button>
    </div>`);
}

/* ---------- Shop ---------- */
function screenShop(res){
  const p=P();
  render(`<div class="top"><button class="back" onclick="screenHome()">◀</button><span class="pill">🪙 ${p.coins}</span></div>
    <div class="card" style="text-align:center">
      <div class="big" id="egg">${res||'🥚'}</div>
      <div style="font-size:20px" id="eggmsg">${res?'새 친구가 섬에 왔어요!':'알을 깨면 펫이 나와요'}</div>
      <p class="note">일반 70% · 레어 25% · 에픽 5%</p>
      <button class="btn purple" ${p.coins<EGG?'disabled':''} onclick="hatch()">🥚 알 뽑기 (${EGG} 🪙)</button>
      ${p.coins<EGG?`<p class="note">코인 ${EGG-p.coins}개 더 필요해요. 미션을 깨보세요!</p>`:''}
    </div>
    <div class="card"><div style="margin-bottom:8px">내 펫 (${p.pets.length})</div>
      <div class="shopgrid">${p.pets.map(e=>`<div>${e}</div>`).join("")||'<span class="note" style="grid-column:1/-1">아직 없어요</span>'}</div></div>`);
}
function hatch(){
  const p=P(); if(p.coins<EGG) return;
  p.coins-=EGG; const r=Math.random();
  const tier = r<.05?"epic":r<.30?"rare":"common";
  const e=pick(PETS[tier]); p.pets.push(e); save(); beep(true);
  const egg=$("egg"); egg.style.transition="transform .5s"; egg.style.transform="rotate(20deg) scale(1.2)";
  setTimeout(()=>{ screenShop(e); if(tier!=="common") flash(tier==="epic"?"✨ EPIC! ✨":"💎 RARE!"); },550);
}

/* ---------- Word book ---------- */
function screenBook(sid){
  const p=P(); sid=sid||p.stage; const s=STAGES.find(x=>x.id===sid);
  const tabs=STAGES.map(x=>`<button class="pill" style="${x.id===sid?'background:var(--yellow)':''}" onclick="screenBook('${x.id}')">${x.icon} ${x.name}</button>`).join(" ");
  const q=(window.__bq||"").toLowerCase();
  const list=s.words.slice().sort((a,b)=>a.w.localeCompare(b.w)).filter(w=>!q||w.w.includes(q)||w.ko.includes(q));
  const rows=list.map(w=>{ const r=p.words[w.id];
    const st = !r?'⬜':isBoss(r)?'👾':r.box>=4?'⭐':'🟩';
    return `<div class="it">${st}<b>${esc(w.w)}</b><span>${esc(w.ko)}</span>${sayBtn(w.w)}</div>`;}).join("");
  render(`<div class="top"><button class="back" onclick="screenHome()">◀</button><b style="font-size:20px">📖 단어장</b></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${tabs}</div>
    <input type="text" id="bq" class="en" placeholder="🔍 단어 또는 뜻 검색" value="${esc(window.__bq||"")}" oninput="window.__bq=this.value;clearTimeout(window.__bt);window.__bt=setTimeout(()=>{screenBook('${sid}');const i=$('bq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
    <p class="note">${s.name} ${s.words.length}개 중 ${list.length}개 · ⬜ 아직 안 배움 · 🟩 배우는 중 · ⭐ 마스터 · 👾 자주 틀린 보스 단어</p>
    <div class="card list en">${rows}</div>`);
}

/* ---------- Settings ---------- */
function screenSettings(){
  const prof = Object.entries(S.profiles).map(([k,p])=>`
    <div class="card">
      <label>이름 <input type="text" id="n_${k}" value="${esc(p.name)}"></label>
      <label>학년 <input type="text" id="g_${k}" value="${esc(p.grade)}"></label>
      <label>하루 새 단어 수</label>
      <div class="colors">${[3,5,8,10,15].map(n=>`<button style="width:auto;padding:0 10px;background:${(p.daily||5)===n?'var(--yellow)':'#fff'};font-family:Jua;font-size:16px" onclick="S.profiles['${k}'].daily=${n};save();screenSettings()">${n}개</button>`).join("")}</div>
      <label>캐릭터 색</label>
      <div class="colors">${COLORS.map(c=>`<button style="background:${c}" class="${p.color===c?'on':''}" onclick="S.profiles['${k}'].color='${c}';save();screenSettings()"></button>`).join("")}</div>
      <button class="btn white small" style="margin-top:12px" onclick="askReset('${k}')">🗑️ ${esc(p.name)} 기록 초기화</button>
    </div>`).join("");
  render(`<div class="top"><button class="back" onclick="saveSettings()">◀ 저장</button><b style="font-size:20px">⚙️ 부모님 설정</b></div>
    ${prof}
    <div class="card"><label>미션 완료 보상 문구 <input type="text" id="rw" value="${esc(S.reward)}"></label>
    <p class="note">미션을 끝내면 이 문구가 완료 도장과 함께 나와요. 아이가 화면을 보여주면 확인해 주세요.</p></div>
    <div id="modal"></div>`);
}
function saveSettings(){
  Object.keys(S.profiles).forEach(k=>{ S.profiles[k].name=$("n_"+k).value.trim()||S.profiles[k].name; S.profiles[k].grade=$("g_"+k).value.trim(); });
  S.reward=$("rw").value.trim()||S.reward; save(); screenProfiles();
}
function askReset(k){
  $("modal").innerHTML=`<div class="modal"><div class="card" style="text-align:center">
    <div style="font-size:20px">${esc(S.profiles[k].name)}의 단어·코인·펫 기록을 모두 지울까요?</div>
    <div class="row" style="margin-top:14px"><button class="btn white small" onclick="$('modal').innerHTML=''">취소</button>
    <button class="btn small" style="background:var(--red);color:#fff" onclick="doReset('${k}')">지우기</button></div></div></div>`;
}
function doReset(k){ const p=S.profiles[k]; Object.assign(p,{coins:0,xp:0,words:{},pets:[],days:{}}); save(); screenSettings(); }

/* start */
if(S.active && S.profiles[S.active]) screenHome(); else screenProfiles();
</script>
</body>
</html>
