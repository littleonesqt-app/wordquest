<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:light;
  --bg:#bfe7ff; --ink:#1d2340; --card:#ffffff; --line:#1d2340;
  --green:#3ccf6e; --red:#ff5a5f; --yellow:#ffd23f; --blue:#3d8bff; --purple:#8b5cf6; --orange:#ff8a3d;
  --muted:#6b7394;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Fredoka",system-ui,sans-serif}
body{min-height:100vh;background:
  linear-gradient(180deg,#8fd3ff 0%,#bfe7ff 45%,#9be38f 45.2%,#7fd472 100%) fixed}
.en{font-family:"Fredoka","Jua",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 14px 40px}
button{font-family:inherit;cursor:pointer;border:none;color:var(--ink);-webkit-text-fill-color:currentColor}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:14px 16px;font-size:20px;border:3px solid var(--line);border-radius:14px;box-shadow:0 5px 0 var(--line);background:var(--yellow);color:var(--ink);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.green{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.white{background:#fff}
.btn.small{font-size:16px;padding:10px 12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
h1{font-size:34px;margin:6px 0 2px;text-align:center;text-shadow:0 3px 0 #fff}
.sub{text-align:center;color:var(--muted);margin:0 0 10px;font-size:16px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 10px;font-size:17px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.back{background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 10px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.grow{flex:1}

/* blocky avatar (original) */
.ava{width:64px;height:84px;position:relative;flex:none}
.ava .head{position:absolute;left:14px;top:0;width:36px;height:34px;background:#ffd8a8;border:3px solid var(--line);border-radius:6px}
.ava .head:before,.ava .head:after{content:"";position:absolute;top:11px;width:6px;height:8px;background:var(--line);border-radius:2px}
.ava .head:before{left:8px}.ava .head:after{right:8px}
.ava .body{position:absolute;left:8px;top:36px;width:48px;height:30px;border:3px solid var(--line);border-radius:6px}
.ava .legs{position:absolute;left:14px;top:66px;width:36px;height:18px;background:#3b4a7a;border:3px solid var(--line);border-radius:4px}
.ava.big{transform:scale(1.4);margin:14px 20px}

.prof{display:flex;align-items:center;gap:14px;text-align:left;font-size:22px}
.prof small{display:block;color:var(--muted);font-size:15px}

.bar{height:16px;background:#e7ebf7;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;text-align:left;box-shadow:0 4px 0 var(--line);font-size:17px}
.stage.on{background:#fff6cc;outline:4px solid var(--orange)}
.stage small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}

.island{position:relative;min-height:150px;background:radial-gradient(ellipse at 50% 80%,#ffe6a3 0 55%,#7fd472 56%);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);overflow:visible;padding:16px 8px 26px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pet{font-size:38px;background:none;animation:bob 2.4s ease-in-out infinite;position:relative;padding:2px}
.pet:nth-child(2n){animation-delay:.6s}.pet:nth-child(3n){animation-delay:1.1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bubble{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--line);border-radius:12px;padding:6px 10px;font-size:15px;white-space:nowrap;z-index:5;animation:none}
.empty{color:#4c6b3c;font-size:16px;align-self:center;text-align:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.word{font-size:46px;text-align:center;margin:8px 0 2px;font-weight:700;letter-spacing:.5px}
.pos{text-align:center;color:var(--muted);font-size:16px}
.ko{text-align:center;font-size:28px;margin:10px 0}
.def{text-align:center;color:var(--muted);font-size:17px}
.ex{font-size:20px;line-height:1.45;background:#f3f6ff;border:2px dashed #9aa6d6;border-radius:12px;padding:12px;margin-top:12px}
.hl{background:var(--yellow);padding:0 4px;border-radius:5px}
.blank{display:inline-block;min-width:80px;border-bottom:4px solid var(--line);text-align:center;color:var(--blue)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:13px;font-size:21px;box-shadow:0 4px 0 var(--line);text-align:center}
.opt .mk{display:block;font-size:14px;opacity:.7;margin-top:3px;font-family:"Jua",sans-serif}
.mean-en{text-align:center;font-family:"Fredoka",sans-serif;font-size:24px;margin:10px 0 2px}
.mean-ko{text-align:center;color:var(--muted);font-size:16px}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--red);color:#fff}
.say{background:var(--blue);color:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 10px;font-size:18px;box-shadow:0 3px 0 var(--line);margin-left:6px;vertical-align:middle}
.tag{display:inline-block;font-size:14px;padding:2px 8px;border-radius:999px;border:2px solid var(--line);background:#fff}
.tag.boss{background:var(--purple);color:#fff}
.tag.new{background:var(--yellow)}
.fb{border-radius:14px;padding:12px;margin-top:12px;font-size:19px;border:3px solid var(--line)}
.fb.ok{background:#d8f8e2}.fb.no{background:#ffe0e1}
input[type=text],textarea{width:100%;font-family:"Fredoka",sans-serif;font-size:22px;padding:12px;border:3px solid var(--line);border-radius:12px;margin-top:12px}
textarea{min-height:90px;font-size:19px}
.combo{white-space:nowrap;position:fixed;top:20%;left:50%;transform:translateX(-50%);font-size:36px;color:#fff;text-shadow:0 3px 0 var(--line),0 0 8px var(--line);pointer-events:none;animation:pop 1s forwards;z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.stamp{text-align:center;font-size:24px;background:var(--yellow);border:3px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 0 var(--line);transform:rotate(-2deg)}
.big{font-size:56px;text-align:center}
.list .it{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:2px dashed #d6dbef;font-size:18px}
.list .it:last-child{border:none}
.list .it b{font-family:"Fredoka";min-width:120px}
.list .it span{flex:1;color:var(--muted);font-size:16px}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:30px;text-align:center}
.note{font-size:15px;color:var(--muted);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:440px;width:100%}
label{display:block;margin-top:10px;font-size:16px}
.colors{display:flex;gap:8px;margin-top:6px}
.colors button{width:36px;height:36px;border-radius:10px;border:3px solid var(--line)}
.colors button.on{outline:4px solid var(--orange)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== WORD DATA =====================
   word | part of speech | 한국어 뜻 | English meaning | example (*marked* form)  */
const STAGES = [
 {id:"e", name:"Elementary", sub:"Grade 4–6 review", icon:"🌱", data:[
"ignore|v.|무시하다|to pay no attention to|If you *ignore* a small leak in the roof, it can turn into a much bigger problem.",
"brief|adj.|짧은, 잠깐의|lasting a short time|After a *brief* pause to catch his breath, the runner sprinted toward the finish line.",
"recognize|v.|알아보다|to know from before|Even after ten years apart, the two friends *recognized* each other immediately.",
"locate|v.|위치를 찾아내다|to find where something is|Bats *locate* insects in the dark by sending out sounds and listening for the echoes.",
"major|adj.|주요한, 큰|important or big|Pollution is a *major* problem in many large cities, especially on hot days.",
"solution|n.|해결책|an answer to a problem|The engineers found a clever *solution* to the traffic problem by changing the timing of the lights.",
"sincere|adj.|진심 어린|honest and real|His apology seemed *sincere*, so she agreed to forgive him.",
"drowsy|adj.|졸린|sleepy|This medicine may make you *drowsy*, so you should not ride a bike after taking it.",
"concern|n.|걱정, 관심사|a worry|The doctor's main *concern* was that the infection might spread if it was not treated quickly.",
"complain|v.|불평하다|to say you are unhappy about something|Instead of *complaining* about the rules, the students wrote a letter suggesting how to improve them.",
"adjust|v.|조정하다|to change slightly to fit|Our eyes need a few minutes to *adjust* when we walk from a bright hallway into a dark theater.",
"prefer|v.|선호하다|to like better|Cats usually *prefer* warm, quiet places where they can nap without being disturbed.",
"rely|v.|의지하다|to depend on|Many farmers *rely* on rain because they cannot afford expensive watering systems.",
"defeat|v.|물리치다, 이기다|to beat in a fight or game|The underdog team *defeated* the champions by using a strategy no one expected.",
"reluctant|adj.|꺼리는, 마지못한|not wanting to do something|He was *reluctant* to try sushi at first, but it quickly became his favorite food.",
"convince|v.|확신시키다, 설득하다|to make someone believe something|It took several experiments to *convince* the class that heavy and light objects fall at the same speed.",
"select|v.|선택하다|to choose|The teacher *selected* three students to represent the class at the science competition.",
"steady|adj.|꾸준한, 흔들림 없는|firm; not changing|The economy showed *steady* growth over the past five years.",
"occur|v.|일어나다, 발생하다|to happen|Earthquakes *occur* most often along the edges of the plates that make up Earth's surface.",
"mysterious|adj.|신비한, 이상한|strange and hard to explain|A *mysterious* light appeared in the sky, and no one could explain where it came from.",
"tradition|n.|전통|a custom passed down|Lighting lanterns during the festival is a *tradition* that goes back hundreds of years.",
"damage|n.|피해, 손상|harm done to something|The hurricane caused so much *damage* that some families could not return home for months.",
"typical|adj.|전형적인, 보통의|normal; usual|On a *typical* school day, students spend about six hours in class.",
"challenge|n.|도전, 어려운 일|something hard that tests you|Climbing the mountain in winter was a *challenge* that only the most experienced hikers attempted.",
"glance|v.|흘끗 보다|to look quickly|She *glanced* at her watch and realized she had only five minutes to catch the bus.",
"imitate|v.|흉내 내다, 모방하다|to copy|Mockingbirds can *imitate* the songs of dozens of other birds and even car alarms.",
"transport|v.|수송하다|to carry from place to place|Pipelines *transport* oil across hundreds of miles of land.",
"capable|adj.|할 수 있는, 유능한|able to do something well|Crows are *capable* of solving puzzles that challenge even some young children.",
"contain|v.|포함하다, 담고 있다|to have inside|Spinach *contains* iron, a mineral that helps carry oxygen through the body.",
"recent|adj.|최근의|happening not long ago|*Recent* research suggests that some dinosaurs may have had feathers.",
"represent|v.|대표하다, 나타내다|to stand for|On the map, the blue lines *represent* rivers, and the green areas show forests.",
"organize|v.|정리하다, 조직하다|to arrange in order|The students *organized* a fundraiser to buy new books for the school library.",
"restore|v.|복구하다|to bring back to how it was|Workers spent years carefully *restoring* the old theater to its original beauty.",
"character|n.|등장인물, 성격|a person in a story; who someone is|The main *character* in the novel grows braver with each obstacle she faces.",
"indicate|v.|나타내다, 가리키다|to show or point out|Dark clouds and a sudden drop in temperature often *indicate* that a storm is coming.",
"method|n.|방법|a way of doing something|Each scientist used a different *method*, but they all reached the same conclusion.",
"absorb|v.|흡수하다|to soak up|Dark clothing tends to *absorb* more sunlight, which is why black shirts feel hotter on summer afternoons.",
"defend|v.|방어하다|to protect from attack|Porcupines *defend* themselves with sharp quills that stick to anything that touches them.",
"instinct|n.|본능|a natural feeling or behavior|Sea turtles find their way to the ocean by *instinct* as soon as they hatch.",
"cooperate|v.|협력하다|to work together|Ants *cooperate* so well that a colony can move food many times heavier than any single ant.",
"isolate|v.|고립시키다|to separate from others|Doctors *isolated* the patient so the disease would not spread to others in the hospital.",
"estimate|v.|어림잡다|to make a careful guess about a number|Experts *estimate* that there are more than eight million species of plants and animals on Earth.",
"doubt|v.|의심하다|to feel unsure|Some scientists *doubted* the new theory until other researchers repeated the experiment.",
"detail|n.|세부 사항|a small part or fact|A good detective notices every *detail*, even a single footprint or a misplaced book.",
"demand|v.|요구하다|to ask for strongly|As the weather grew colder, customers *demanded* warmer jackets, and the store quickly ran out.",
"attitude|n.|태도|the way you think or feel about something|A positive *attitude* will not solve every problem, but it makes hard work feel much more manageable.",
"effect|n.|효과, 영향|a result|Scientists are still studying the long-term *effect* of screen time on children's sleep.",
"splendid|adj.|훌륭한, 화려한|very good; beautiful|The palace gardens were *splendid*, filled with fountains, statues, and rare flowers.",
"admire|v.|존경하다, 감탄하다|to respect or look at with pleasure|Many people *admire* explorers who risked their lives to map places no one had ever seen.",
"observe|v.|관찰하다|to watch carefully|Astronomers *observe* distant stars to learn how the universe has changed over time.",
"identify|v.|알아보다, 확인하다|to recognize who or what something is|Birdwatchers can *identify* many species just by listening to their songs.",
"familiar|adj.|익숙한|well known|The song sounded *familiar*, but I could not remember where I had heard it before.",
"react|v.|반응하다|to respond|How a person *reacts* to stress can affect both their health and their relationships.",
"describe|v.|묘사하다|to tell what something is like|In your essay, *describe* a place that is important to you and explain why it matters.",
"flexible|adj.|유연한|able to bend easily; able to change|Rubber is *flexible*, so it can bend and stretch without breaking.",
"aware|adj.|알고 있는, 인식하는|knowing about something|Many people are not *aware* that octopuses can change the color of their skin in less than a second.",
"source|n.|근원, 출처|where something comes from|The sun is the main *source* of energy for nearly every living thing on Earth.",
"attach|v.|붙이다, 첨부하다|to join one thing to another|Before launching the rocket, we carefully *attached* the fins so that it would fly in a straight line.",
"resource|n.|자원|something useful you can use|Water is a valuable *resource*, so many states have rules about how it can be used.",
"curious|adj.|호기심 있는|wanting to know more|*Curious* about how clocks work, he carefully took one apart and studied every tiny gear.",
"opportunity|n.|기회|a good chance|The exchange program gave students an *opportunity* to live with a family in another country.",
"collapse|v.|무너지다|to fall down suddenly|After days of heavy rain, part of the old stone wall *collapsed* into the river.",
"border|n.|국경, 경계|the line between two places|Rivers often form a natural *border* between two countries because they are easy to recognize on a map.",
"responsible|adj.|책임 있는|in charge; trustworthy|As the oldest sibling, she felt *responsible* for making sure her brothers got to school on time.",
"prepare|v.|준비하다|to get ready|Squirrels *prepare* for winter by burying hundreds of nuts throughout the fall.",
"conclude|v.|결론을 내리다|to decide after thinking about the facts|After comparing the footprints with the photographs, the investigators *concluded* that the animal had been a mountain lion rather than a large dog.",
"encounter|v.|마주치다|to meet unexpectedly|While snorkeling, we *encountered* a sea turtle that swam calmly alongside us.",
"journey|n.|여행, 여정|a trip from one place to another|Monarch butterflies make a *journey* of nearly three thousand miles to reach Mexico each fall.",
"expand|v.|확장하다|to make bigger|When water freezes, it *expands*, which is why a full bottle can crack in the freezer.",
"clever|adj.|영리한|quick to learn and understand|The *clever* fox pretended to be injured in order to lead the hunters away from its den.",
"labor|n.|노동|hard work|Building the railroad across the country required the *labor* of thousands of workers.",
"decade|n.|10년|a period of ten years|Over the past *decade*, smartphones have changed the way people read, shop, and talk with friends.",
"region|n.|지역|an area|The desert *region* receives less than ten inches of rain each year.",
"nourish|v.|영양분을 주다|to feed and help grow|Rain *nourishes* the soil, allowing crops to grow strong and healthy.",
"volunteer|v.|자원하다|to offer to help for free|Every Saturday, she *volunteers* at the animal shelter, feeding and walking the dogs.",
"contribute|v.|기여하다|to give or add to something|Every student *contributed* an idea, and together they designed a mural for the school entrance.",
"approach|v.|다가가다|to come near|As the hikers *approached* the summit, the air grew thinner and every step required more effort.",
"support|v.|지지하다, 받치다|to help; to hold up|Strong columns *support* the roof of the ancient temple.",
"confident|adj.|자신감 있는|sure of yourself|After weeks of practice, she felt *confident* that she could deliver her speech without notes.",
"positive|adj.|긍정적인; 확신하는|good or hopeful; sure|The test results were *positive*, meaning the new medicine worked better than expected.",
"function|n.|기능|what something is used for|The main *function* of roots is to absorb water and nutrients from the soil.",
"decrease|v.|줄어들다, 줄이다|to become smaller or less|Planting trees in cities can *decrease* summer temperatures by providing shade and moisture.",
"pursue|v.|추구하다, 뒤쫓다|to chase; to try to reach|After college, she *pursued* her dream of becoming a marine biologist.",
"independent|adj.|독립적인|not needing others|Many teenagers want to be more *independent*, so they take part-time jobs to earn their own money.",
"amount|n.|양, 액수|how much of something there is|The *amount* of plastic in the ocean has grown so large that some patches can be seen from airplanes.",
"achieve|v.|이루다, 달성하다|to reach a goal by effort|She *achieved* her goal of running a mile in under eight minutes after practicing every morning for months.",
"suggest|v.|제안하다|to offer an idea|The evidence *suggests* that the ancient city was abandoned because of a long drought.",
"wisdom|n.|지혜|good judgment from experience|Grandma's *wisdom* came from a long life full of both success and failure.",
"avoid|v.|피하다|to stay away from something|Polar bears *avoid* thin ice because it can crack under their heavy bodies without warning.",
"faint|adj.|희미한|weak; not clear|We heard a *faint* tapping sound from inside the wall, but we could not find its source.",
"determine|v.|알아내다, 결정하다|to find out or decide|Doctors use X-rays to *determine* whether a bone is broken or just bruised.",
"process|n.|과정|a series of steps|Turning raw cotton into a T-shirt is a long *process* that involves many machines.",
"reveal|v.|드러내다, 밝히다|to show something hidden|The X-ray *revealed* a tiny crack in the bone that the doctor had not expected.",
"narrate|v.|이야기하다, 서술하다|to tell a story|The old sailor *narrated* the tale of his shipwreck while the children listened in silence.",
"prevent|v.|막다, 예방하다|to stop from happening|Washing your hands often helps *prevent* the spread of colds and flu.",
"communicate|v.|소통하다|to share information or ideas|Dolphins *communicate* with clicks and whistles that can travel long distances underwater.",
"enormous|adj.|거대한|extremely big|Blue whales are so *enormous* that their hearts alone can weigh as much as a small car.",
"complex|adj.|복잡한|having many connected parts|The human brain is so *complex* that scientists still do not fully understand how memories are stored.",
"odor|n.|냄새|a smell|Skunks release a powerful *odor* that can be smelled from far away.",
"remote|adj.|외딴, 먼|far away|The research station is so *remote* that supplies arrive only once every three months.",
"ordinary|adj.|평범한|normal; not special|What looked like an *ordinary* rock turned out to be a meteorite from outer space.",
"anxious|adj.|불안한, 걱정하는|worried and nervous|He felt *anxious* the night before the recital, worrying that he would forget the notes in front of everyone.",
"extinct|adj.|멸종된|no longer existing|The dodo bird became *extinct* in the 1600s, not long after sailors arrived on its island.",
"investigate|v.|조사하다|to look into something carefully|Scientists *investigated* why so many fish were dying in the lake and found pollution from a factory.",
"escape|v.|탈출하다|to get free|The parrot *escaped* through an open window and was found two days later in a neighbor's tree.",
"operate|v.|작동하다, 수술하다|to work or run|Only trained workers are allowed to *operate* the heavy machines at the factory.",
"shelter|n.|피난처, 보호소|a place that keeps you safe|During the tornado, the family took *shelter* in the basement until the danger passed.",
"startle|v.|깜짝 놀라게 하다|to surprise suddenly|A loud clap of thunder *startled* the horses, and they galloped across the field.",
"numerous|adj.|수많은|very many|*Numerous* studies have shown that regular exercise improves both mood and memory.",
"compete|v.|경쟁하다|to try to win against others|Thousands of students *compete* in the national spelling bee, but only one can win the trophy.",

  while(p.days[t]){ n++; t--; }
  return n;
}
const level = p=> Math.floor(p.xp/200)+1;
const isBoss = r => r && r.wrong>=2 && r.box<3;
const esc = s=> String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a=> a[Math.floor(Math.random()*a.length)];
const $ = id=>document.getElementById(id);
const exHTML = w=> esc(w.ex).replace(/\*(.+?)\*/, '<span class="hl">$1</span>');
const exBlank = w=> esc(w.ex).replace(/\*(.+?)\*/, '<span class="blank">?</span>');

/* sound + speech (fail quietly if the browser refuses) */
let AC=null;
function beep(ok){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    o.type="square"; o.frequency.value = ok?880:180; g.gain.value=.06;
    o.start(); if(ok){ o.frequency.setValueAtTime(1320, AC.currentTime+.08); }
    o.stop(AC.currentTime + (ok?.18:.25));
  }catch(e){}
}
const canSay = "speechSynthesis" in window;
function say(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
const sayBtn = t=> canSay ? `<button class="say" onclick="say('${esc(t).replace(/&#39;/g,"\\'")}')">🔊</button>` : "";

function stageStats(p, s){

/* ---------- Mission ---------- */
let M=null;
function startMission(){
  const p=P();

  const reviews = dueList(p).slice(0, Math.max(6, daily+2));
  const stage = STAGES.find(s=>s.id===p.stage);

  }
  const qs=[];
  news.forEach(id=>{ qs.push({id,t:"mean"}); qs.push({id,t:"fill"}); });
  reviews.forEach(id=>{ const r=p.words[id]; qs.push({id, t: r.box>=3 ? "spell" : (r.box>=2? pick(["fill","spell"]) : pick(["mean","fill"]))}); });
  M={news, reviews, all:[...news,...reviews], learnI:0, q:shuffle(qs), qi:0, ok:{}, retried:{}, coins:0, combo:0, right:0, total:0};

// what kind of change the word has in its example: base, s, ed (past / past participle), ing
function infl(x){
  const f=x.form.toLowerCase(), b=x.w.toLowerCase();
  if(f===b) return "base";
  if(f.endsWith("ing") && !b.endsWith("ing")) return "ing";
  if((f.endsWith("s") && !b.endsWith("s")) || f===b+"es") return "s";
  return "ed";
}
const posKey = x=> x.pos.replace(/[^a-z]/g,"").slice(0,3);
// wrong choices that are changed the same way as the answer (taken from their own example sentences)
function formDistractors(w, n=3){
  const k=infl(w), pk=posKey(w);
  const same = x=> x.id!==w.id && infl(x)===k && posKey(x)===pk && x.form.toLowerCase()!==w.form.toLowerCase();
  let pool = STAGES.find(s=>s.id===w.stage).words.filter(same);
  if(pool.length<n) pool = pool.concat(Object.values(WORDS).filter(x=>same(x) && x.stage!==w.stage));
  return shuffle(pool).slice(0,n);
}
function formText(x, cap){
  const f=x.form.toLowerCase();
  return cap ? f[0].toUpperCase()+f.slice(1) : f;
}
function distractors(w, field, n=3){
  const pool = STAGES.find(s=>s.id===w.stage).words.filter(x=>x.id!==w.id && x[field]!==w[field]);
  return shuffle(pool).slice(0,n);
}

function screenQuiz(){
  if(M.qi>=M.q.length) return screenBonus();
  const q=M.q[M.qi], w=WORDS[q.id], r=P().words[q.id];
  const boss = isBoss(r);
  const tag = boss? `<span class="tag boss">👾 BOSS WORD · 2x coins</span>` : (M.news.includes(q.id)? `<span class="tag new">NEW</span>`:`<span class="tag">🔁 Review</span>`);
  const prog = `<div class="bar grow"><i style="width:${M.qi/M.q.length*100}%;background:var(--orange)"></i></div>`;
  let body="";
  if(q.t==="mean"){
    const opts = shuffle([w, ...distractors(w,"en")]);
    body = `<div class="note" style="text-align:center">What does it mean?</div>
      <div class="word en">${esc(w.w)}${sayBtn(w.w)}</div>
      <div class="ex en" style="font-size:18px">${exHTML(w)} ${sayBtn(w.ex.replace(/\*/g,""))}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.id===w.id}" onclick="answer(this)"><span class="en">${esc(o.en)}</span><span class="mk">${esc(o.ko)}</span></button>`).join("")}</div>`;
  } else if(q.t==="fill"){
    const opts = shuffle([w, ...formDistractors(w)]);
    const cap = /^[A-Z]/.test(w.form);
    body = `<div class="note" style="text-align:center">Which word fits the blank?</div>
      <div class="ex en">${exBlank(w)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt en" data-ok="${o.id===w.id}" onclick="answer(this)">${esc(formText(o,cap))}</button>`).join("")}</div>`;
  } else {
    body = `<div class="note" style="text-align:center">Type the word in the right form for the sentence!</div>
      <div class="mean-en">${esc(w.en)}</div>
      <div class="mean-ko">${esc(w.ko)}</div>
      <div class="ex en">${exBlank(w)}</div>
      <div class="note" style="margin-top:8px">Hint: <b class="en">${esc(w.form[0].toLowerCase())}${"_ ".repeat(w.form.length-1)}</b> (${w.form.length} letters${infl(w)!=="base"?` · base form: ${esc(w.w[0])}…`:""})</div>
      <form onsubmit="event.preventDefault();spellCheck()"><input id="sp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here">
      <button class="btn blue" style="margin-top:10px">Check</button></form>`;
  }
  render(`<div class="qtop">${quitBtn()}${prog}<span class="pill">🪙 +${M.coins}</span></div>
    <div style="margin:6px 2px">${tag}</div>
    <div class="card" id="qc">${body}<div id="fb"></div></div>`);
  if(q.t==="spell") setTimeout(()=>{ const i=$("sp"); i&&i.focus(); },100);
}

function answer(btn){
  const ok = btn.dataset.ok==="true";
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.dataset.ok==="true") b.classList.add("right"); });
  if(!ok) btn.classList.add("wrong");
  resolveQ(ok);
}
function spellCheck(){
  const q=M.q[M.qi], w=WORDS[q.id]; const v=($("sp").value||"").trim().toLowerCase();
  if(!v) return;
  const ok = v===w.w.toLowerCase() || v===w.form.toLowerCase();
  $("sp").disabled=true; document.querySelector("#qc form button").disabled=true;
  resolveQ(ok);
}
function resolveQ(ok){
  const q=M.q[M.qi], w=WORDS[q.id], r=P().words[q.id];
  M.total++; beep(ok);
  let msg;
  if(ok){
    M.right++; M.combo++;
    let c = 10 * (isBoss(r)?2:1);
    if(M.combo>0 && M.combo%3===0){ c+=10; flash(`🔥 ${M.combo} COMBO! +10`); }
    M.coins+=c; msg=`<div class="fb ok">⭕ Correct! +${c} 🪙<div class="en" style="margin-top:6px">${exHTML(w)}</div></div>`;
  } else {
    M.combo=0;
    if(!M.retried[q.id+q.t]){ M.retried[q.id+q.t]=1; M.q.push({...q}); }
    M.ok[q.id]=false;
    msg=`<div class="fb no">❌ The answer is <b class="en">${esc(w.form.toLowerCase())}</b>${infl(w)!=="base"?` <span class="note en">(${esc(w.w)})</span>`:""} = <span class="en">${esc(w.en)}</span> <span class="note">(${esc(w.ko)})</span><div class="en" style="margin-top:6px">${exHTML(w)}</div><div class="note">You'll see this one again soon!</div></div>`;
  }
  $("fb").innerHTML = msg + `<button class="btn ${ok?'green':''}" style="margin-top:12px" onclick="M.qi++;screenQuiz()">Next ▶</button>`;
  $("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function flash(t){ const d=document.createElement("div"); d.className="combo"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }

function screenBonus(){
  const w = WORDS[pick(M.all)]; M.bonusTry=0;

  render(`<div class="qtop">${quitBtn()}<span class="tag new">⭐ BONUS STAGE · up to +40 🪙</span></div>

async function grammarCheck(text){
  // Free public LanguageTool API (no key). Returns list of {offset,length,message,rep}
  const body = new URLSearchParams({text, language:"en-US"});
  const ctl = new AbortController(); const tm=setTimeout(()=>ctl.abort(),8000);
  try{
    const r = await fetch("https://api.languagetool.org/v2/check",{method:"POST",body,signal:ctl.signal});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    return j.matches.map(m=>({offset:m.offset,length:m.length,message:m.message,rep:(m.replacements[0]||{}).value}));
  } finally { clearTimeout(tm); }
}
function applyFixes(t, ms){
  let out=t; ms.slice().sort((x,y)=>y.offset-x.offset).forEach(m=>{ if(m.rep!=null) out=out.slice(0,m.offset)+m.rep+out.slice(m.offset+m.length); });
  return out;
}
function markErrors(t, ms){
  let html="", i=0;
  ms.slice().sort((x,y)=>x.offset-y.offset).forEach(m=>{ if(m.offset<i) return;
    html+=esc(t.slice(i,m.offset))+`<span style="background:#ffd0d2;text-decoration:underline wavy var(--red)">${esc(t.substr(m.offset,m.length)||" ")}</span>`; i=m.offset+m.length; });
  return html+esc(t.slice(i));
}
let checking=false;
async function checkMine(){
  if(checking) return;
  const w=WORDS[M.bonus]; let t=($("mine").value||"").trim();
  const stem = w.w.toLowerCase().slice(0, Math.max(4, w.w.length-2));
  const words = t.split(/\s+/).filter(Boolean).length;
  if(!t.toLowerCase().includes(stem)){ $("fb").innerHTML=`<div class="fb no">Use the word <b class="en">${esc(w.w)}</b> in your sentence!</div>`; return; }
  if(words<5){ $("fb").innerHTML=`<div class="fb no">A little longer, please! (5+ words)</div>`; return; }
  checking=true; $("fb").innerHTML=`<div class="fb">🔎 Checking grammar...</div>`;
  let ms=null;
  try{ ms = await grammarCheck(t); }catch(e){ ms=null; }
  checking=false;
  if(ms===null){
    $("fb").innerHTML=`<div class="fb">⚠️ Grammar check isn't available right now. You still get the bonus!</div>`;
    return bonusDone(t,30,false);
  }
  if(!ms.length){ $("fb").innerHTML=`<div class="fb ok">✅ Perfect grammar!</div>`; return bonusDone(t, M.bonusTry?30:40, true); }
  const fixed = applyFixes(t, ms);
  M.bonusTry=(M.bonusTry||0)+1;
  $("fb").innerHTML=`<div class="fb no">
      <div>✏️ Let's fix it!</div>
      <div class="en" style="margin-top:8px">${markErrors(t,ms)}</div>
      <div class="en" style="margin-top:8px;background:#d8f8e2;border-radius:10px;padding:8px">👉 ${esc(fixed)}</div>
      <ul class="note en" style="margin:8px 0 0;padding-left:20px">${ms.slice(0,4).map(m=>`<li>${esc(m.message)}</li>`).join("")}</ul>
      <div class="note" style="margin-top:6px">Rewrite it yourself and submit for +30, or finish now for +20.</div>
      <div class="row" style="margin-top:10px">
        <button class="btn white small" onclick="bonusDone(${JSON.stringify(fixed).replace(/"/g,'&quot;')},20,false)">Finish +20</button>
        <button class="btn blue small" onclick="$('mine').focus()">Rewrite ✍️</button>
      </div></div>`;
}
function bonusDone(t, c, perfect){
  M.coins+=c; M.mine=t; beep(true); flash(`${perfect?'🏆':'⭐'} +${c}`);
  setTimeout(finish,900);
}

function finish(){
  const p=P(), t=today();
  M.all.forEach(id=>{
    const r = p.words[id] || {box:0, wrong:0};
    if(M.ok[id]) r.box=Math.min(5, r.box+1); else { r.box=1; r.wrong=(r.wrong||0)+1; }
    r.due = t + INT[r.box]; p.words[id]=r;
  });
  const firstToday = !p.days[t];
  if(firstToday) M.coins+=20;
  const before=level(p);
  p.coins+=M.coins; p.xp+=M.coins; p.days[t]=true; save();
  const up = level(p)>before;
  const now=new Date();
  render(`
    <div class="card" style="text-align:center">
      <div class="big">${M.right===M.total?'🏆':'🎉'}</div>
      <div style="font-size:26px">Mission Clear!</div>
      <p style="font-size:20px">Correct ${M.right}/${M.total} · 🪙 +${M.coins} ${firstToday?'(includes +20 daily bonus)':''}</p>
      ${up?`<p style="font-size:22px;color:var(--purple)">⬆️ LEVEL UP! Lv.${level(p)}</p>`:''}
      <p class="note">🔥 ${streak(p)}-day streak</p>
      ${M.mine?`<div class="ex en" style="text-align:left">✍️ ${esc(M.mine)}</div>`:''}
    </div>
    <div class="stamp">✅ ${esc(p.name)} finished today's mission<br><span class="note" style="color:var(--ink)">${now.getMonth()+1}/${now.getDate()} ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span><br>${esc(S.reward)}</div>
    <div class="row" style="margin-top:18px">
      <button class="btn purple small" onclick="screenShop()">🥚 Hatch</button>
      <button class="btn green small" onclick="screenHome()">Home</button>
    </div>`);
}

function buzz(){ // "boo-boo" sound
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    [0,.28].forEach(t=>{ const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
      o.type="sawtooth"; o.frequency.value=140; g.gain.value=.08; o.start(AC.currentTime+t); o.stop(AC.currentTime+t+.2); });
  }catch(e){}
}
function hatch(){
  const p=P(); if(p.coins<EGG) return;
  p.coins-=EGG; const r=Math.random();
  const tier = r<.05?"epic":r<.30?"rare":"common";
  const e=pick(PETS[tier]); const dup = p.pets.includes(e);
  if(!dup) p.pets.push(e);
  save();
  const egg=$("egg"); egg.style.transition="transform .5s"; egg.style.transform="rotate(20deg) scale(1.2)";
  setTimeout(()=>{
    screenShop(e, dup);
    if(dup){ buzz(); flash("❌ BOO-BOO!"); }
    else { beep(true); if(tier!=="common") flash(tier==="epic"?"✨ EPIC! ✨":"💎 RARE!"); }
  },550);
}

/* ---------- Word book ---------- */
function screenBook(sid){
  const p=P(); sid=sid||p.stage; const s=STAGES.find(x=>x.id===sid);
  const tabs=STAGES.map(x=>`<button class="pill" style="${x.id===sid?'background:var(--yellow)':''}" onclick="screenBook('${x.id}')">${x.icon} ${x.name}</button>`).join(" ");
  const q=(window.__bq||"").toLowerCase();
  const list=s.words.slice().sort((a,b)=>a.w.localeCompare(b.w)).filter(w=>!q||w.w.includes(q)||w.ko.includes(q)||w.en.toLowerCase().includes(q));
  const rows=list.map(w=>{ const r=p.words[w.id];
    const st = !r?'⬜':isBoss(r)?'👾':r.box>=4?'⭐':'🟩';
    return `<div class="it">${st}<b>${esc(w.w)}</b><span>${esc(w.en)}<br><small>${esc(w.ko)}</small></span>${sayBtn(w.w)}</div>`;}).join("");
  render(`<div class="top"><button class="back" onclick="screenHome()">◀</button><b style="font-size:20px">📖 Word Book</b></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${tabs}</div>
    <input type="text" id="bq" class="en" placeholder="🔍 Search words or meanings" value="${esc(window.__bq||"")}" oninput="window.__bq=this.value;clearTimeout(window.__bt);window.__bt=setTimeout(()=>{screenBook('${sid}');const i=$('bq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
    <p class="note">${s.name}: ${list.length} of ${s.words.length} · ⬜ new · 🟩 learning · ⭐ mastered · 👾 boss</p>
    <div class="card list en">${rows}</div>`);
}

/* ---------- Settings ---------- */
function screenSettings(){
  const prof = Object.entries(S.profiles).map(([k,p])=>`
    <div class="card">
      <label>Name <input type="text" id="n_${k}" value="${esc(p.name)}"></label>
      <label>Grade <input type="text" id="g_${k}" value="${esc(p.grade)}"></label>
      <label>New words per day</label>
      <div class="colors">${[3,5,8,10,15].map(n=>`<button style="width:auto;padding:0 10px;background:${(p.daily||5)===n?'var(--yellow)':'#fff'};font-family:Jua;font-size:16px" onclick="S.profiles['${k}'].daily=${n};save();screenSettings()">${n}</button>`).join("")}</div>
      <label>Character color</label>
      <div class="colors">${COLORS.map(c=>`<button style="background:${c}" class="${p.color===c?'on':''}" onclick="S.profiles['${k}'].color='${c}';save();screenSettings()"></button>`).join("")}</div>
      <button class="btn white small" style="margin-top:12px" onclick="askReset('${k}')">🗑️ Reset ${esc(p.name)}'s progress</button>
    </div>`).join("");
  render(`<div class="top"><button class="back" onclick="saveSettings()">◀ Save</button><b style="font-size:20px">⚙️ Parent settings</b></div>
    ${prof}
    <div class="card"><label>Mission reward message <input type="text" id="rw" value="${esc(S.reward)}"></label>
    <p class="note">Shown with the completion stamp after each mission.</p></div>
    <div id="modal"></div>`);
}
function saveSettings(){
  Object.keys(S.profiles).forEach(k=>{ S.profiles[k].name=$("n_"+k).value.trim()||S.profiles[k].name; S.profiles[k].grade=$("g_"+k).value.trim(); });
  S.reward=$("rw").value.trim()||S.reward; save(); screenProfiles();
}
function askReset(k){
  $("modal").innerHTML=`<div class="modal"><div class="card" style="text-align:center">
    <div style="font-size:20px">Delete all words, coins and pets for ${esc(S.profiles[k].name)}?</div>
    <div class="row" style="margin-top:14px"><button class="btn white small" onclick="$('modal').innerHTML=''">Cancel</button>
    <button class="btn small" style="background:var(--red);color:#fff" onclick="doReset('${k}')">Delete</button></div></div></div>`;
}
function doReset(k){ const p=S.profiles[k]; Object.assign(p,{coins:0,xp:0,words:{},pets:[],days:{}}); save(); screenSettings(); }

/* start */
if(S.active && S.profiles[S.active]) screenHome(); else screenProfiles();
</script>
</body>
